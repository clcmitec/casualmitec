<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITEC — Casual Labour Management</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --mitec-navy: #092253;
      --slate-bg: #f8f9fa;
      --border-slate: #cfd8dc;
      --text-header: #102a43;
      --text-body: #334e68;
      --accent-steel: #486581;
      --success-cyan: #00827f;
      --wait-amber: #8d6e63;
      --font-main: 'Trebuchet MS', sans-serif;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { 
      margin: 0; background-color: var(--slate-bg); 
      font-family: var(--font-main); color: var(--text-body);
      padding-bottom: 80px; 
    }

    /* Sharp Industrial Header */
    .header { 
      background: #fff; padding: 12px; 
      border-bottom: 3px solid var(--mitec-navy);
      position: sticky; top: 0; z-index: 1000;
      display: flex; justify-content: center;
    }
    .brand-img { height: 22px; width: auto; filter: contrast(1.1); }

    .container { max-width: 500px; margin: 0 auto; padding: 12px; }

    /* Slab Profile Card */
    .profile-card { 
      background: var(--mitec-navy);
      padding: 15px; display: flex; align-items: center; gap: 15px; 
      margin-bottom: 20px; color: #fff;
      border-radius: 2px; /* Sharp corners */
    }
    .avatar { 
      width: 45px; height: 45px; 
      border: 1px solid rgba(255,255,255,0.4); 
      object-fit: cover; filter: grayscale(0.2);
    }
    .profile-info h2 { font-size: 14px; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }
    .profile-info span { font-size: 9px; opacity: 0.6; letter-spacing: 1px; }

    /* Dashboard Dividers */
    .date-divider { 
      font-size: 10px; font-weight: bold; color: var(--mitec-navy); 
      padding: 8px 0; border-bottom: 1px solid var(--border-slate);
      margin: 20px 0 10px 0; letter-spacing: 1px;
    }

    /* Structural Shift Cards */
    .shift-card { 
      background: #fff; 
      border: 1px solid var(--border-slate);
      padding: 15px; margin-bottom: 8px; 
      position: relative;
    }

    .shift-header { display: flex; justify-content: space-between; border-bottom: 1px dashed #eee; padding-bottom: 8px; margin-bottom: 10px; }
    .shift-dept { font-size: 15px; font-weight: bold; color: var(--mitec-navy); margin: 0; }
    
    .status-label { 
      font-size: 8px; font-weight: 900; letter-spacing: 1px;
      padding: 2px 6px; border: 1px solid;
    }
    .label-open { color: var(--success-cyan); border-color: var(--success-cyan); }
    .label-booked { color: var(--mitec-navy); border-color: var(--mitec-navy); background: #f0f4f8; }
    .label-wait { color: var(--wait-amber); border-color: var(--wait-amber); }

    .shift-meta { font-size: 12px; color: var(--accent-steel); display: flex; gap: 12px; }
    .meta-item { display: flex; align-items: center; gap: 4px; }

    /* Professional Buttons */
    .btn-action { 
      width: 100%; margin-top: 12px; padding: 10px; 
      font-size: 12px; font-weight: bold; text-transform: uppercase;
      border: 1px solid var(--mitec-navy); cursor: pointer;
      transition: 0.2s;
    }
    .btn-book { background: var(--mitec-navy); color: white; }
    .btn-book:hover { background: #0c317a; }
    .btn-confirmed { background: transparent; color: var(--success-cyan); border-color: var(--success-cyan); cursor: default; }
    .btn-full { background: #f1f3f5; color: #adb5bd; border-color: #dee2e6; cursor: not-allowed; }
    
    .btn-cancel { 
      background: transparent; color: #d32f2f; border: 1px solid #ffcdd2;
      margin-top: 8px; font-size: 10px;
    }

    /* Bottom Utility Bar */
    .bottom-nav { 
      position: fixed; bottom: 0; width: 100%; background: #fff; 
      display: flex; border-top: 2px solid var(--mitec-navy);
      z-index: 1000;
    }
    .nav-item { 
      flex: 1; padding: 12px 0; text-align: center;
      color: #999; font-size: 9px; font-weight: bold; cursor: pointer;
    }
    .nav-item.active { color: var(--mitec-navy); background: #f8f9fa; }
    .nav-item i { font-size: 18px; display: block; margin-bottom: 2px; }

    #sync-overlay { 
      position: fixed; inset: 0; background: #fff; 
      z-index: 2000; display: flex; flex-direction: column; 
      align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <div id="sync-overlay">
    <i class="ph ph-shield-check" style="font-size: 32px; color: var(--mitec-navy);"></i>
    <p style="font-size: 10px; letter-spacing: 2px; margin-top: 10px;">SYSTEM SYNCING...</p>
  </div>

  <header class="header">
    <img class="brand-img" src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC">
  </header>

  <div class="container">
    <div class="profile-card">
      <img id="userAvatar" class="avatar" src="https://via.placeholder.com/100" alt="Avatar">
      <div class="profile-info">
        <span>LOGGED IN AS</span>
        <h2 id="userNameDisplay">...</h2>
      </div>
    </div>

    <div id="available-view"></div>
    <div id="booked-view" style="display:none;"></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchView(0)"><i class="ph ph-stack"></i><span>AVAILABLE</span></div>
    <div class="nav-item" onclick="switchView(1)"><i class="ph ph-clipboard-text"></i><span>MY SCHEDULE</span></div>
    <div class="nav-item" onclick="window.location.reload()"><i class="ph ph-arrows-clockwise"></i><span>REFRESH</span></div>
  </nav>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_vN5v3vRPhuT_H_FpXpA67v9E0W1I3J_vU6tZ5h7R1W8uL9vT/exec"; 

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");
      
      if (!userDocNo) { window.location.href = "index.html"; return; }

      const record = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      document.getElementById("userNameDisplay").textContent = record.full_name || "MITEC USER";
      if (record.photo_link) document.getElementById("userAvatar").src = record.photo_link;

      fetchData(userDocNo);
    };

    function fetchData(docNo) {
      fetch(`${SCRIPT_URL}?action=getShifts&userDocNo=${docNo}`)
        .then(r => r.json())
        .then(res => {
          if(res.ok) {
            renderList(res.allShifts, res.myUpcomingEvents);
            renderSchedule(res.myUpcomingEvents);
            document.getElementById('sync-overlay').style.display = 'none';
          }
        });
    }

    function renderList(shifts, bookings) {
      const container = document.getElementById('available-view');
      container.innerHTML = '';
      const dates = [...new Set(shifts.map(s => s.date))];
      
      dates.forEach(date => {
        container.innerHTML += `<div class="date-divider">${date}</div>`;
        shifts.filter(s => s.date === date).forEach(s => {
          const booked = bookings.find(b => b.shift_id === s.id);
          const isFull = s.slotsLeft <= 0;
          
          container.innerHTML += `
            <div class="shift-card">
              <div class="shift-header">
                <h3 class="shift-dept">${s.dept}</h3>
                <span class="status-label ${booked ? 'label-booked' : 'label-open'}">
                  ${booked ? 'ASSIGNED' : (isFull ? 'FULL' : s.slotsLeft + ' SLOTS')}
                </span>
              </div>
              <div class="shift-meta">
                <div class="meta-item"><i class="ph ph-clock"></i> ${s.time}</div>
              </div>
              ${!booked ? `
                <button class="btn-action btn-book" onclick="processAction('${s.id}', '${s.date}', '${s.dept}', '${s.time}')">
                  ACCEPT ASSIGNMENT
                </button>
              ` : `
                <button class="btn-action btn-confirmed">BOOKING CONFIRMED</button>
              `}
            </div>`;
        });
      });
    }

    function renderSchedule(bookings) {
      const container = document.getElementById('booked-view');
      container.innerHTML = '<div class="date-divider">CONFIRMED SCHEDULE</div>';
      
      if (bookings.length === 0) {
        container.innerHTML += `<p style="font-size:11px; color:#999; text-align:center; margin-top:40px;">No shifts currently assigned.</p>`;
        return;
      }

      bookings.forEach(b => {
        const wait = b.status === "WAITLIST";
        container.innerHTML += `
          <div class="shift-card" style="border-left: 3px solid ${wait ? 'var(--wait-amber)' : 'var(--mitec-navy)'}">
            <div class="shift-header">
              <h3 class="shift-dept">${b.dept}</h3>
              <span class="status-label ${wait ? 'label-wait' : 'label-booked'}">${b.status}</span>
            </div>
            <div class="shift-meta">
              <div class="meta-item"><i class="ph ph-calendar"></i> ${b.date}</div>
              <div class="meta-item"><i class="ph ph-clock"></i> ${b.time}</div>
            </div>
            <button class="btn-action btn-cancel" onclick="cancelAction('${b.shift_id}')">REMOVE FROM SCHEDULE</button>
          </div>`;
      });
    }

    function switchView(index) {
      document.getElementById('available-view').style.display = index === 0 ? 'block' : 'none';
      document.getElementById('booked-view').style.display = index === 1 ? 'block' : 'none';
      const navs = document.querySelectorAll('.nav-item');
      navs.forEach((n, i) => n.classList.toggle('active', i === index));
    }

    function processAction(id, date, dept, time) {
      const docNo = localStorage.getItem("mcl_doc_no");
      if (!confirm("Add this shift to your schedule?")) return;
      
      fetch(`${SCRIPT_URL}?action=submit&shiftId=${id}&date=${date}&dept=${dept}&time=${time}&userDocNo=${docNo}`)
        .then(r => r.json())
        .then(res => {
          if (res.ok === "FULL") {
            if (confirm("Shift capacity reached. Join standby list?")) {
              fetch(`${SCRIPT_URL}?action=submit&shiftId=${id}&date=${date}&dept=${dept}&time=${time}&userDocNo=${docNo}&isWaitlist=true`)
                .then(() => window.location.reload());
            }
          } else { window.location.reload(); }
        });
    }

    function cancelAction(shiftId) {
      const docNo = localStorage.getItem("mcl_doc_no");
      if (!confirm("Remove this shift?")) return;
      fetch(`${SCRIPT_URL}?action=cancel&shiftId=${shiftId}&userDocNo=${docNo}`)
        .then(() => window.location.reload());
    }
  </script>
</body>
</html>
