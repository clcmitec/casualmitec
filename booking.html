<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITEC — Casual Labour Portal</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --mitec-blue: #092253;
      --mitec-gradient: linear-gradient(135deg, #092253 0%, #153269 100%);
      --bg-light: #f8fafc;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --font-main: 'Trebuchet MS', sans-serif;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { 
      margin: 0; padding: 0; 
      background-color: white; 
      font-family: var(--font-main); 
      color: var(--text-dark);
      padding-bottom: 100px;
    }

    /* Top Branding */
    .header { padding: 25px 0; text-align: center; background: #fff; }
    .brand-img { height: 28px; width: auto; }

    .container { max-width: 480px; margin: 0 auto; padding: 0 20px; }

    /* Profile Section - Exactly like your screenshot */
    .profile-card { 
      background: var(--mitec-gradient); 
      border-radius: 16px; padding: 24px; 
      display: flex; align-items: center; gap: 18px; 
      margin-bottom: 25px; color: #fff;
      box-shadow: 0 10px 25px rgba(9, 34, 83, 0.15);
    }
    .avatar { 
      width: 60px; height: 60px; 
      border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); 
      object-fit: cover;
    }
    .profile-info span { font-size: 10px; text-transform: uppercase; opacity: 0.8; letter-spacing: 1px; }
    .profile-info h2 { font-size: 16px; margin: 4px 0 0 0; font-weight: 700; line-height: 1.3; }

    /* Elevated Content Container */
    .duty-box {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .box-title { 
      font-size: 12px; font-weight: 700; color: var(--mitec-blue); 
      margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;
    }

    /* Input-Style Items (The "New Theme" look) */
    .duty-item {
      display: flex; align-items: center; gap: 14px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
    }
    .duty-item i { color: var(--text-muted); font-size: 20px; width: 24px; }
    .item-content { flex: 1; }
    .item-label { font-size: 14px; color: var(--text-muted); }
    .item-value { font-size: 15px; font-weight: 600; color: var(--text-dark); margin-top: 2px; }

    /* Status Tags */
    .status-badge {
      font-size: 8px; font-weight: 800; padding: 3px 8px; border-radius: 4px;
      position: absolute; top: 12px; right: 12px; text-transform: uppercase;
      background: #f1f5f9; color: var(--text-muted); border: 1px solid var(--border-color);
    }
    .status-confirmed { background: #ecfdf5; color: #059669; border-color: #a7f3d0; }
    .status-wait { background: #fffbeb; color: #d97706; border-color: #fde68a; }

    /* Confirm Button - From your Screenshot */
    .btn-submit {
      width: 100%; padding: 18px; 
      background: var(--mitec-blue); 
      color: #fff; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 700; 
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: 0.2s;
    }
    .btn-submit:active { transform: scale(0.98); opacity: 0.9; }
    .btn-outline {
      background: transparent; border: 1.5px solid #fee2e2; color: #dc2626; margin-top: 10px;
    }

    /* Bottom Nav */
    nav.bottom-nav { 
      position: fixed; bottom: 0; width: 100%; background: #fff; 
      display: flex; padding: 15px 0 30px 0; border-top: 1px solid var(--border-color);
      z-index: 1000;
    }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #94a3b8; font-size: 9px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
    .nav-item.active { color: var(--mitec-blue); }
    .nav-item i { font-size: 24px; }

    #sync-loader { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <div id="sync-loader">
    <i class="ph ph-circle-notch ph-spin" style="font-size: 40px; color: var(--mitec-blue);"></i>
  </div>

  <header class="header">
    <img class="brand-img" src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC">
  </header>

  <div class="container">
    <div class="profile-card">
      <img id="userAvatar" class="avatar" src="https://via.placeholder.com/150">
      <div class="profile-info">
        <span>CURRENT USER</span>
        <h2 id="userNameDisplay">...</h2>
      </div>
    </div>

    <div id="available-view"></div>
    <div id="booked-view" style="display:none;"></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab(0)"><i class="ph ph-calendar-plus"></i><span>AVAILABLE</span></div>
    <div class="nav-item" onclick="switchTab(1)"><i class="ph ph-calendar-check"></i><span>BOOKED</span></div>
    <div class="nav-item" onclick="window.location.reload()"><i class="ph ph-clock-counter-clockwise"></i><span>HISTORY</span></div>
  </nav>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQO2wNLYqbclyen6E8ermntNGuAJZyMosl7t7HFbgvyhWKRYEHwyqnyOyesoX3YdOH/exec"; 

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");
      
      if (!userDocNo) { window.location.href = "index.html"; return; }

      const record = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      document.getElementById("userNameDisplay").textContent = record.full_name || "MITEC STAFF";
      if (record.photo_link) document.getElementById("userAvatar").src = record.photo_link;

      refreshData(userDocNo);
    };

    function refreshData(docNo) {
      fetch(`${SCRIPT_URL}?action=getShifts&userDocNo=${docNo}`)
        .then(r => r.json())
        .then(res => {
          if(res.ok) {
            renderAvailable(res.allShifts, res.myUpcomingEvents);
            renderBooked(res.myUpcomingEvents);
            document.getElementById('sync-loader').style.display = 'none';
          }
        });
    }

    function renderAvailable(shifts, bookings) {
      const container = document.getElementById('available-view');
      container.innerHTML = '';
      const dates = [...new Set(shifts.map(s => s.date))];
      
      dates.forEach(date => {
        let html = `<div class="duty-box"><div class="box-title">Available Duty: ${date}</div>`;
        shifts.filter(s => s.date === date).forEach(s => {
          const booked = bookings.find(b => b.shift_id === s.id);
          html += `
            <div class="duty-item">
              <i class="ph ph-briefcase"></i>
              <div class="item-content">
                <div class="item-label">${s.dept}</div>
                <div class="item-value">${s.time}</div>
              </div>
              ${booked ? '<span class="status-badge status-confirmed">Confirmed</span>' : ''}
            </div>
            ${!booked ? `<button class="btn-submit" onclick="handleAction('${s.id}', '${s.date}', '${s.dept}', '${s.time}')"><i class="ph ph-check-circle"></i> Confirm Attendance</button>` : ''}
            <div style="height:15px"></div>`;
        });
        container.innerHTML += html + `</div>`;
      });
    }

    function renderBooked(bookings) {
      const container = document.getElementById('booked-view');
      container.innerHTML = '';
      if (bookings.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:50px;">No upcoming duties.</p>';
        return;
      }
      let html = `<div class="duty-box"><div class="box-title">My Registered Schedule</div>`;
      bookings.forEach(b => {
        html += `
          <div class="duty-item">
            <i class="ph ph-calendar"></i>
            <div class="item-content">
              <div class="item-label">${b.dept} | ${b.date}</div>
              <div class="item-value">${b.time}</div>
            </div>
            <span class="status-badge ${b.status === 'WAITLIST' ? 'status-wait' : 'status-confirmed'}">${b.status}</span>
          </div>
          <button class="btn-submit btn-outline" onclick="cancelAction('${b.shift_id}')">Cancel Registration</button>
          <div style="height:20px"></div>`;
      });
      container.innerHTML = html + `</div>`;
    }

    function switchTab(index) {
      document.getElementById('available-view').style.display = index === 0 ? 'block' : 'none';
      document.getElementById('booked-view').style.display = index === 1 ? 'block' : 'none';
      const items = document.querySelectorAll('.nav-item');
      items.forEach((it, i) => it.classList.toggle('active', i === index));
    }

    function handleAction(id, date, dept, time) {
      const docNo = localStorage.getItem("mcl_doc_no");
      if (!confirm("Confirm duty registration?")) return;
      fetch(`${SCRIPT_URL}?action=submit&shiftId=${id}&date=${date}&dept=${dept}&time=${time}&userDocNo=${docNo}`)
        .then(() => window.location.reload());
    }

    function cancelAction(shiftId) {
      const docNo = localStorage.getItem("mcl_doc_no");
      if (!confirm("Remove this duty registration?")) return;
      fetch(`${SCRIPT_URL}?action=cancel&shiftId=${shiftId}&userDocNo=${docNo}`)
        .then(() => window.location.reload());
    }
  </script>
</body>
</html>
