<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITEC — Casual Labour Portal</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --mitec-blue: #092253;
      --mitec-gradient: linear-gradient(135deg, #092253 0%, #153269 100%);
      --bg-slate: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-thin: #e2e8f0;
      --accent-teal: #0d9488;
      --accent-amber: #b45309;
      --accent-red: #be123c;
      --font-main: 'Trebuchet MS', sans-serif;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { 
      margin: 0; background-color: var(--bg-slate); 
      font-family: var(--font-main); color: var(--text-main);
      padding-bottom: 110px;
    }

    /* Professional Branding Header */
    .header { padding: 22px 0; text-align: center; background: #fff; border-bottom: 1px solid var(--border-thin); }
    .brand-img { height: 24px; width: auto; }

    .container { max-width: 480px; margin: 0 auto; padding: 15px; }

    /* Executive Profile Card - Matched to your Screenshot */
    .profile-card { 
      background: var(--mitec-gradient); 
      border-radius: 16px; padding: 24px; 
      display: flex; align-items: center; gap: 18px; 
      margin: 10px 0 25px 0; color: #fff;
      box-shadow: 0 10px 25px rgba(9, 34, 83, 0.15);
    }
    .avatar { 
      width: 58px; height: 58px; 
      border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); 
      object-fit: cover;
    }
    .profile-info span { font-size: 10px; text-transform: uppercase; opacity: 0.7; letter-spacing: 1px; }
    .profile-info h2 { font-size: 16px; margin: 4px 0 0 0; font-weight: 700; line-height: 1.2; }

    /* Date Markers */
    .date-label { 
      font-size: 11px; font-weight: 800; color: var(--mitec-blue); 
      margin: 30px 0 15px 5px; text-transform: uppercase; letter-spacing: 1.5px;
      display: flex; align-items: center; gap: 12px;
    }
    .date-label::after { content: ""; flex: 1; height: 1px; background: var(--border-thin); }

    /* Premium Card Design */
    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--border-thin); 
      border-radius: 16px; padding: 22px; 
      margin-bottom: 16px; position: relative; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .card-title { font-size: 18px; font-weight: 700; color: var(--mitec-blue); margin: 0; }
    
    /* Clean Status Pills */
    .status-pill { 
      font-size: 9px; font-weight: 800; padding: 4px 10px; border-radius: 6px; 
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .pill-open { background: #f0fdfa; color: var(--accent-teal); border: 1px solid #ccfbf1; }
    .pill-confirmed { background: #f0f9ff; color: var(--mitec-blue); border: 1px solid #e0f2fe; }
    .pill-wait { background: #fffbeb; color: var(--accent-amber); border: 1px solid #fef3c7; }

    .card-meta { font-size: 14px; color: var(--text-muted); display: grid; gap: 8px; margin-bottom: 20px; }
    .meta-row { display: flex; align-items: center; gap: 10px; }
    .meta-row i { font-size: 18px; color: var(--mitec-blue); opacity: 0.6; }

    /* Unified Executive Buttons */
    .btn-exec { 
      width: 100%; height: 50px; border-radius: 12px; 
      background: var(--mitec-blue); color: #fff; 
      font-size: 14px; font-weight: 700; border: none; cursor: pointer; 
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-exec:active { transform: scale(0.97); opacity: 0.95; }
    
    .btn-secondary { background: #f8fafc; border: 1.5px solid var(--border-thin); color: var(--mitec-blue); cursor: default; }
    .btn-remove { background: transparent; border: 1px solid #fecaca; color: var(--accent-red); margin-top: 12px; }

    /* Floating Nav Bar */
    nav.bottom-nav { 
      position: fixed; bottom: 0; width: 100%; background: #fff; 
      display: flex; padding: 12px 0 32px 0; border-top: 1px solid var(--border-thin);
      box-shadow: 0 -5px 15px rgba(0,0,0,0.04); z-index: 1000;
    }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #94a3b8; font-size: 9px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
    .nav-item.active { color: var(--mitec-blue); }
    .nav-item i { font-size: 24px; }

    #sync-loader { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <div id="sync-loader">
    <i class="ph ph-shield-check ph-spin" style="font-size: 40px; color: var(--mitec-blue);"></i>
  </div>

  <header class="header">
    <img class="brand-img" src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC">
  </header>

  <div class="container">
    <div class="profile-card">
      <img id="userAvatar" class="avatar" src="https://via.placeholder.com/150">
      <div class="profile-info">
        <span>CASUAL LABOUR SYSTEM</span>
        <h2 id="userNameDisplay">STAFF MEMBER</h2>
      </div>
    </div>

    <div id="available-view"></div>
