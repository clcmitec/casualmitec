<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITEC — Casual Labour Portal</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --bg-base: #f4f7f9;
      --mitec-blue: #092253;
      --accent-teal: #008f8f;
      --accent-gold: #b38f00;
      --card-bg: #ffffff;
      --text-main: #1c1c1e;
      --text-muted: #636366;
      --border-light: #e5e5ea;
      --shadow-float: 0 6px 16px rgba(0, 0, 0, 0.05);
      --font-main: 'Trebuchet MS', sans-serif;
    }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { margin: 0; padding: 0; background-color: var(--bg-base); font-family: var(--font-main); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }
    .container { max-width: 450px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; padding: 20px 0; background: #fff; border-bottom: 1px solid var(--border-light); position: sticky; top: 0; z-index: 100; }
    .brand-img { height: 22px; width: auto; }
    .profile-card { background: var(--mitec-blue); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px; margin: 15px 0 25px 0; color: #fff; box-shadow: var(--shadow-float); }
    .avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); object-fit: cover; }
    .profile-name { font-size: 15px; font-weight: 600; margin: 0; }
    .profile-label { font-size: 10px; text-transform: uppercase; opacity: 0.7; }
    .date-divider { font-size: 11px; font-weight: 800; color: var(--mitec-blue); margin: 25px 0 12px 5px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
    .date-divider::after { content: ""; flex: 1; height: 1px; background: var(--border-light); }
    .shift-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 14px; padding: 18px; margin-bottom: 12px; box-shadow: var(--shadow-float); position: relative; }
    .status-tag { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; position: absolute; top: 18px; right: 18px; background: #e8f5f5; color: var(--accent-teal); }
    .shift-title { font-size: 16px; font-weight: 700; margin: 0 0 4px 0; color: var(--mitec-blue); padding-right: 60px; }
    .shift-meta { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-bottom: 12px; }
    .btn-action { width: 100%; height: 44px; border-radius: 8px; background: var(--mitec-blue); color: #fff; font-size: 14px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-action:disabled { background: #d1d1d6; color: #8e8e93; cursor: not-allowed; }
    nav.bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border-light); }
    .nav-item { color: var(--text-muted); font-size: 10px; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .nav-item.active { color: var(--mitec-blue); font-weight: bold; }
  </style>
</head>
<body>

  <header class="header">
    <img class="brand-img" src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC">
  </header>

  <div class="container">
    <div class="profile-card">
      <img id="userAvatar" class="avatar" src="https://via.placeholder.com/100" alt="Avatar">
      <div class="profile-info">
        <span class="profile-label">Casual Labour Portal</span>
        <h2 id="userNameDisplay" class="profile-name">Staff Member</h2>
      </div>
    </div>
    <div id="available-content"></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active"><i class="ph ph-magnifying-glass" style="font-size:22px"></i><span>Available</span></div>
    <div class="nav-item"><i class="ph ph-calendar-check" style="font-size:22px"></i><span>Booked</span></div>
    <div class="nav-item"><i class="ph ph-clock-counter-clockwise" style="font-size:22px"></i><span>History</span></div>
  </nav>

  <script>
    // --- 1. CONFIGURATION ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTsKTg47Ra-1Mzlu6kA6JNX0Dvfw1zHTf2saNmyIr4I1-_vjLnBYI04DfsyNPbx_e8/exec"; 

    // --- 2. SHIFT DATA ---
    const shifts = [
      { id: 'S001', date: '20.05.2026', dept: 'OUTLET', time: '10 AM', slots: 10 },
      { id: 'S002', date: '20.05.2026', dept: 'OUTLET', time: '11 AM', slots: 20 },
      { id: 'S003', date: '20.05.2026', dept: 'EXHIBITION', time: '10 AM', slots: 8 },
      { id: 'S004', date: '21.05.2026', dept: 'OUTLET', time: '10 AM', slots: 10 },
      { id: 'S005', date: '21.05.2026', dept: 'OUTLET', time: '11 AM', slots: 20 },
      { id: 'S006', date: '21.05.2026', dept: 'CATERING', time: '03 PM', slots: 70, notes: '15 - Serving Alcohol' },
      { id: 'S007', date: '21.05.2026', dept: 'EXHIBITION', time: '10 AM', slots: 8 },
      { id: 'S008', date: '22.05.2026', dept: 'OUTLET', time: '10 AM', slots: 10 },
      { id: 'S009', date: '22.05.2026', dept: 'OUTLET', time: '11 AM', slots: 20 },
      { id: 'S010', date: '22.05.2026', dept: 'CATERING', time: '03 PM', slots: 15 },
      { id: 'S011', date: '22.05.2026', dept: 'EXHIBITION', time: '10 AM', slots: 8 },
      { id: 'S012', date: '23.05.2026', dept: 'OUTLET', time: '10 AM', slots: 10 },
      { id: 'S013', date: '23.05.2026', dept: 'OUTLET', time: '11 AM', slots: 20 },
      { id: 'S014', date: '23.05.2026', dept: 'EXHIBITION', time: '10 AM', slots: 8 }
    ];

    // --- 3. INITIALIZE ---
    window.onload = () => {
      // Capture ID from casualmitec.online redirect
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");
      
      const record = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      document.getElementById("userNameDisplay").textContent = record.full_name || "Staff Member";
      if (record.photo_link) document.getElementById("userAvatar").src = record.photo_link;

      renderShifts();
    };

    function renderShifts() {
      const container = document.getElementById('available-content');
      const dates = [...new Set(shifts.map(s => s.date))];
      dates.forEach(date => {
        container.innerHTML += `<div class="date-divider">${date}</div>`;
        shifts.filter(s => s.date === date).forEach(s => {
          container.innerHTML += `
            <div class="shift-card">
              <span class="status-tag">Open</span>
              <h3 class="shift-title">${s.dept}</h3>
              <div class="shift-meta"><i class="ph ph-clock"></i> ${s.time} | ${s.slots} spots</div>
              ${s.notes ? `<div style="font-size:11px; color:var(--accent-gold); margin-bottom:10px;">* ${s.notes}</div>` : ''}
              <button class="btn-action" onclick="handleBooking('${s.id}', '${s.date}', '${s.dept}', '${s.time}', this)">Book Now</button>
            </div>`;
        });
      });
    }

    // --- 4. FETCH ACTION ---
    function handleBooking(id, date, dept, time, btn) {
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");

      if (!userDocNo) return alert("Error: User identity missing. Please login at casualmitec.online.");
      if (!confirm(`Submit request for ${dept} on ${date}?`)) return;

      const originalText = btn.innerText;
      btn.innerText = "Processing...";
      btn.disabled = true;

      // Construct URL parameters for the GET request
      const finalUrl = `${SCRIPT_URL}?action=submit&shiftId=${id}&date=${date}&dept=${dept}&time=${time}&userDocNo=${userDocNo}`;

      fetch(finalUrl)
        .then(r => r.json())
        .then(res => {
          alert(res.message);
          if (res.ok) {
            btn.innerText = "Submitted ✅";
            btn.style.background = "var(--accent-teal)";
          } else {
            btn.innerText = originalText;
            btn.disabled = false;
          }
        })
        .catch(e => {
          alert("Network Error. Check your connection.");
          btn.innerText = originalText;
          btn.disabled = false;
        });
    }
  </script>
</body>
</html>
