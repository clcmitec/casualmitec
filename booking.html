<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITEC — Casual Labour Portal</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --mitec-blue: #092253;
      --mitec-gradient: linear-gradient(135deg, #092253 0%, #153269 100%);
      --bg-slate: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-thin: #e2e8f0;
      
      --pill-blue-bg: #f0f9ff;
      --pill-blue-text: #092253;
      --pill-blue-border: #e0f2fe;

      --pill-teal-bg: #f0fdfa;
      --pill-teal-text: #0d9488;
      --pill-teal-border: #ccfbf1;

      --accent-amber: #b45309;
      --accent-red: #be123c;
      --font-main: 'Trebuchet MS', sans-serif;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { margin: 0; background-color: var(--bg-slate); font-family: var(--font-main); color: var(--text-main); padding-bottom: 110px; }
    .header { padding: 22px 0; text-align: center; background: #fff; border-bottom: 1px solid var(--border-thin); }
    .brand-img { height: 24px; width: auto; }
    .container { max-width: 480px; margin: 0 auto; padding: 15px; }

    /* Profile Card */
    .profile-card { 
      background: var(--mitec-gradient); border-radius: 16px; padding: 24px; 
      display: flex; align-items: center; gap: 18px; margin: 10px 0 25px 0; color: #fff;
      box-shadow: 0 10px 25px rgba(9, 34, 83, 0.15);
    }
    .avatar { width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); object-fit: cover; }
    .profile-info span { font-size: 10px; text-transform: uppercase; opacity: 0.7; letter-spacing: 1px; }
    .profile-info h2 { font-size: 16px; margin: 4px 0 0 0; font-weight: 700; line-height: 1.2; }

    .date-label { 
      font-size: 11px; font-weight: 800; color: var(--mitec-blue); 
      margin: 30px 0 15px 5px; text-transform: uppercase; letter-spacing: 1.5px;
      display: flex; align-items: center; gap: 12px;
    }
    .date-label::after { content: ""; flex: 1; height: 1px; background: var(--border-thin); }

    /* Cards */
    .card { background: var(--card-bg); border: 1px solid var(--border-thin); border-radius: 16px; padding: 22px; margin-bottom: 16px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    .card.locked { opacity: 0.5; filter: grayscale(0.8); pointer-events: none; }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .card-title { font-size: 18px; font-weight: 700; color: var(--mitec-blue); margin: 0; }
    
    .status-pill { font-size: 9px; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; border: 1px solid transparent; }
    .pill-open { background: var(--pill-blue-bg); color: var(--pill-blue-text); border-color: var(--pill-blue-border); }
    .pill-confirmed { background: var(--pill-teal-bg); color: var(--pill-teal-text); border-color: var(--pill-teal-border); }
    .pill-full { background: #fff1f2; color: var(--accent-red); border: 1px solid #fecdd3; }
    .pill-wait { background: #fffbeb; color: var(--accent-amber); border: 1px solid #fef3c7; }

    .card-meta { font-size: 14px; color: var(--text-muted); display: grid; gap: 8px; margin-bottom: 20px; }
    .meta-row { display: flex; align-items: center; gap: 10px; }

    .btn-exec { width: 100%; height: 50px; border-radius: 12px; background: var(--mitec-blue); color: #fff; font-size: 14px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-waitlist { background: #fff; border: 1.5px solid var(--accent-amber); color: var(--accent-amber); }
    .btn-remove { background: transparent; border: 1px solid #fecaca; color: var(--accent-red); margin-top: 12px; }

    nav.bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; padding: 12px 0 32px 0; border-top: 1px solid var(--border-thin); z-index: 1000; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #94a3b8; font-size: 9px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
    .nav-item.active { color: var(--mitec-blue); }
    .nav-item i { font-size: 24px; }

    /* Animated Sync Loader */
    #sync-loader { 
      position: fixed; inset: 0; background: #ffffff; 
      z-index: 9999; display: flex; flex-direction: column; 
      align-items: center; justify-content: center; 
    }
    
    .loader-icon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px; height: 80px;
      margin-bottom: 16px;
    }
    
    .loader-pulse {
      position: absolute;
      width: 100%; height: 100%;
      background: rgba(9, 34, 83, 0.08);
      border-radius: 50%;
      animation: fluidPulse 1.8s infinite ease-in-out;
    }

    .loader-text {
      font-size: 11px;
      font-weight: 800;
      color: var(--mitec-blue);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: textBlink 1.4s infinite ease-in-out;
    }

    @keyframes fluidPulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    @keyframes textBlink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="sync-loader">
    <div class="loader-icon-wrapper">
      <div class="loader-pulse"></div>
      <i class="ph ph-shield-check" style="font-size: 42px; color: var(--mitec-blue); position: relative; z-index: 2;"></i>
    </div>
    <div class="loader-text">Processing Request...</div>
  </div>

  <header class="header"><img class="brand-img" src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC"></header>

  <div class="container">
    <div class="profile-card">
      <img id="userAvatar" class="avatar" src="https://via.placeholder.com/150">
      <div class="profile-info"><span>Current User</span><h2 id="userNameDisplay">STAFF MEMBER</h2></div>
    </div>
    <div id="available-view"></div>
    <div id="booked-view" style="display:none;"></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab(0)"><i class="ph ph-calendar-plus"></i><span>Available</span></div>
    <div class="nav-item" onclick="switchTab(1)"><i class="ph ph-briefcase"></i><span>My Schedule</span></div>
    <div class="nav-item" onclick="window.location.reload()"><i class="ph ph-arrows-clockwise"></i><span>Refresh</span></div>
  </nav>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQO2wNLYqbclyen6E8ermntNGuAJZyMosl7t7HFbgvyhWKRYEHwyqnyOyesoX3YdOH/exec"; 

    let isRequestInProgress = false;
    let activeController = null; // Hardware interceptor configuration

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");
      if (!userDocNo) { window.location.href = "index.html"; return; }
      const record = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      document.getElementById("userNameDisplay").textContent = record.full_name || "MITEC STAFF";
      if (record.photo_link) document.getElementById("userAvatar").src = record.photo_link;
      refreshData(userDocNo);
    };

    function showLoader(message) {
      const loader = document.getElementById('sync-loader');
      if (message) {
        loader.querySelector('.loader-text').textContent = message;
      }
      loader.style.display = 'flex';
    }

    function refreshData(docNo) {
      if (activeController) activeController.abort(); 
      activeController = new AbortController();

      fetch(`${SCRIPT_URL}?action=getShifts&userDocNo=${docNo}`, { signal: activeController.signal })
        .then(r => r.json())
        .then(res => {
          if(res.ok) {
            renderAvailable(res.allShifts, res.myUpcomingEvents);
            renderBooked(res.myUpcomingEvents);
            document.getElementById('sync-loader').style.display = 'none';
            isRequestInProgress = false;
          }
        }).catch(err => {
          if (err.name !== 'AbortError') isRequestInProgress = false;
        });
    }

    function renderAvailable(shifts, bookings) {
      const container = document.getElementById('available-view');
      container.innerHTML = '';
      const dates = [...new Set(shifts.map(s => s.date))];
      
      dates.forEach(date => {
        container.innerHTML += `<div class="date-label">${date}</div>`;
        const hasBookingToday = bookings.some(b => b.date === date && b.status.toUpperCase() !== 'CANCELLED');

        shifts.filter(s => s.date === date).forEach(s => {
          const myBooking = bookings.find(b => b.shift_id === s.id && b.status.toUpperCase() !== 'CANCELLED');
          const isMyShift = !!myBooking;
          const isFull = s.slotsLeft <= 0;
          const isLockedByPolicy = hasBookingToday && !isMyShift;

          let pillClass = 'pill-open';
          let statusPillText = isFull ? 'Full' : s.slotsLeft + ' Left';
          
          if (isMyShift) {
            const rawStatus = String(myBooking.status).toUpperCase();
            const isWait = rawStatus === 'WAITLIST' || rawStatus === 'WAITING LIST';
            pillClass = isWait ? 'pill-wait' : 'pill-confirmed';
            statusPillText = isWait ? 'In a Waiting List' : 'Confirmed';
          } else if (isLockedByPolicy) {
            pillClass = 'pill-full';
            statusPillText = 'Locked';
          } else if (isFull) {
            pillClass = 'pill-full';
          }

          container.innerHTML += `
            <div class="card ${isLockedByPolicy ? 'locked' : ''}">
              <div class="card-header">
                <h3 class="card-title">${s.dept}</h3>
                <span class="status-pill ${pillClass}">
                  ${statusPillText}
                </span>
              </div>
              <div class="card-meta"><div class="meta-row"><i class="ph ph-clock"></i> ${s.time}</div></div>
              ${isMyShift ? 
                `<button class="btn-exec" style="background:#f1f5f9; color:#94a3b8; cursor:default;">Shift Booked ✔️</button>` : 
                (isLockedByPolicy ? 
                  `<button class="btn-exec" style="background:#e2e8f0; color:#94a3b8; cursor:not-allowed;">Locked</button>` :
                  (isFull ? 
                    `<button class="btn-exec btn-waitlist" onclick="handleBooking('${s.id}', '${s.date}', '${s.dept}', '${s.time}', true, this)"><i class="ph ph-clock-afternoon"></i> Join Waitlist</button>` : 
                    `<button class="btn-exec" onclick="handleBooking('${s.id}', '${s.date}', '${s.dept}', '${s.time}', false, this)">Book Now</button>`
                  )
                )
              }
            </div>`;
        });
      });
    }

    function renderBooked(bookings) {
      const container = document.getElementById('booked-view');
      container.innerHTML = '<div class="date-label">My Registered Schedule</div>';
      const activeBookings = bookings.filter(b => b.status.toUpperCase() !== 'CANCELLED');
      
      if (activeBookings.length === 0) { 
        container.innerHTML += '<p style="text-align:center; padding:50px; color:#94a3b8;">No duties registered.</p>'; 
        return; 
      }
      
      activeBookings.forEach(b => {
        const rawStatus = String(b.status).toUpperCase();
        const isWait = rawStatus === "WAITLIST" || rawStatus === "WAITING LIST";
        const displayStatusText = isWait ? "Waiting List" : "Confirmed";

        container.innerHTML += `
          <div class="card" style="border-left: 4px solid ${isWait ? 'var(--accent-amber)' : 'var(--mitec-blue)'}">
            <div class="card-header">
              <h3 class="card-title">${b.dept}</h3>
              <span class="status-pill ${isWait ? 'pill-wait' : 'pill-confirmed'}">${displayStatusText}</span>
            </div>
            <div class="card-meta">
              <div class="meta-row"><i class="ph ph-calendar"></i> ${b.date}</div>
              <div class="meta-row"><i class="ph ph-clock"></i> ${b.time}</div>
            </div>
            <button class="btn-exec btn-remove" onclick="cancelBooking('${b.shift_id}', this)">Request Cancel</button>
          </div>`;
      });
    }

    function switchTab(index) {
      document.getElementById('available-view').style.display = index === 0 ? 'block' : 'none';
      document.getElementById('booked-view').style.display = index === 1 ? 'block' : 'none';
      const items = document.querySelectorAll('.nav-item');
      items.forEach((it, i) => it.classList.toggle('active', i === index));
    }

    function handleBooking(id, date, dept, time, waitlist, element) {
      if (isRequestInProgress) return;
      
      const docNo = localStorage.getItem("mcl_doc_no");
      const msg = waitlist ? `Join waitlist for ${dept}?` : `Book shift for ${dept}?`;
      if (!confirm(msg)) return;
      
      isRequestInProgress = true;
      if (element) {
        element.disabled = true;
        element.style.opacity = "0.4";
        element.innerText = "Processing...";
      }
      
      showLoader(waitlist ? "Securing Standby Placement..." : "Booking Selected Shift...");
      
      if (activeController) activeController.abort();
      activeController = new AbortController();

      fetch(`${SCRIPT_URL}?action=submit&shiftId=${id}&date=${date}&dept=${dept}&time=${time}&userDocNo=${docNo}${waitlist ? '&isWaitlist=true' : ''}`, { signal: activeController.signal })
        .then(() => window.location.reload())
        .catch(err => { if (err.name !== 'AbortError') isRequestInProgress = false; });
    }

    function cancelBooking(shiftId, element) {
      if (isRequestInProgress) return;
      
      const docNo = localStorage.getItem("mcl_doc_no");
      if (!confirm("Are you sure you want to request cancellation for this duty registration?")) return;
      
      isRequestInProgress = true;
      if (element) {
        element.disabled = true;
        element.style.opacity = "0.4";
        element.innerText = "Cancelling...";
      }
      
      showLoader("Processing Cancellation Request...");
      
      if (activeController) activeController.abort();
      activeController = new AbortController();

      fetch(`${SCRIPT_URL}?action=cancel&shiftId=${shiftId}&userDocNo=${docNo}`, { signal: activeController.signal })
        .then(() => window.location.reload())
        .catch(err => { if (err.name !== 'AbortError') isRequestInProgress = false; });
    }
  </script>
</body>
</html>
