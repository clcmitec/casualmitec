<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITEC — Casual Labour Portal</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --mitec-blue: #092253;
      --mitec-gradient: linear-gradient(135deg, #092253 0%, #153269 100%);
      --bg-slate: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-thin: #e2e8f0;
      --accent-teal: #0d9488;
      --accent-amber: #b45309;
      --accent-red: #be123c;
      --font-main: 'Trebuchet MS', sans-serif;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { 
      margin: 0; background-color: var(--bg-slate); 
      font-family: var(--font-main); color: var(--text-main);
      padding-bottom: 110px;
    }

    .header { padding: 22px 0; text-align: center; background: #fff; border-bottom: 1px solid var(--border-thin); }
    .brand-img { height: 24px; width: auto; }
    .container { max-width: 480px; margin: 0 auto; padding: 15px; }

    /* Executive Profile Card */
    .profile-card { 
      background: var(--mitec-gradient); 
      border-radius: 16px; padding: 24px; 
      display: flex; align-items: center; gap: 18px; 
      margin: 10px 0 25px 0; color: #fff;
      box-shadow: 0 10px 25px rgba(9, 34, 83, 0.15);
    }
    .avatar { width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); object-fit: cover; }
    .profile-info span { font-size: 10px; text-transform: uppercase; opacity: 0.7; letter-spacing: 1px; }
    .profile-info h2 { font-size: 16px; margin: 4px 0 0 0; font-weight: 700; line-height: 1.2; }

    .date-label { 
      font-size: 11px; font-weight: 800; color: var(--mitec-blue); 
      margin: 30px 0 15px 5px; text-transform: uppercase; letter-spacing: 1.5px;
      display: flex; align-items: center; gap: 12px;
    }
    .date-label::after { content: ""; flex: 1; height: 1px; background: var(--border-thin); }

    /* Card Design */
    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--border-thin); 
      border-radius: 16px; padding: 22px; 
      margin-bottom: 16px; position: relative; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .card.locked { opacity: 0.6; filter: grayscale(0.5); pointer-events: none; }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .card-title { font-size: 18px; font-weight: 700; color: var(--mitec-blue); margin: 0; }
    
    .status-pill { font-size: 9px; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
    .pill-open { background: #f0fdfa; color: var(--accent-teal); border: 1px solid #ccfbf1; }
    .pill-confirmed { background: #f0f9ff; color: var(--mitec-blue); border: 1px solid #e0f2fe; }
    .pill-locked { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }

    .card-meta { font-size: 14px; color: var(--text-muted); display: grid; gap: 8px; margin-bottom: 20px; }
    .meta-row { display: flex; align-items: center; gap: 10px; }
    .meta-row i { font-size: 18px; color: var(--mitec-blue); }

    .btn-exec { 
      width: 100%; height: 50px; border-radius: 12px; 
      background: var(--mitec-blue); color: #fff; 
      font-size: 14px; font-weight: 700; border: none; cursor: pointer; 
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-locked { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
    .btn-remove { background: transparent; border: 1px solid #fecaca; color: var(--accent-red); margin-top: 12px; }

    nav.bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; padding: 12px 0 32px 0; border-top: 1px solid var(--border-thin); z-index: 1000; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #94a3b8; font-size: 9px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
    .nav-item.active { color: var(--mitec-blue); }
    .nav-item i { font-size: 24px; }

    #sync-loader { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <div id="sync-loader"><i class="ph ph-shield-check ph-spin" style="font-size: 40px; color: var(--mitec-blue);"></i></div>

  <header class="header"><img class="brand-img" src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC"></header>

  <div class="container">
    <div class="profile-card">
      <img id="userAvatar" class="avatar" src="https://via.placeholder.com/150">
      <div class="profile-info"><span>CASUAL LABOUR SYSTEM</span><h2 id="userNameDisplay">STAFF MEMBER</h2></div>
    </div>
    <div id="available-view"></div>
    <div id="booked-view" style="display:none;"></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab(0)"><i class="ph ph-calendar-plus"></i><span>Available</span></div>
    <div class="nav-item" onclick="switchTab(1)"><i class="ph ph-briefcase"></i><span>My Schedule</span></div>
    <div class="nav-item" onclick="window.location.reload()"><i class="ph ph-arrows-clockwise"></i><span>Refresh</span></div>
  </nav>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQO2wNLYqbclyen6E8ermntNGuAJZyMosl7t7HFbgvyhWKRYEHwyqnyOyesoX3YdOH/exec"; 

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");
      if (!userDocNo) { window.location.href = "index.html"; return; }
      const record = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      document.getElementById("userNameDisplay").textContent = record.full_name || "MITEC STAFF";
      if (record.photo_link) document.getElementById("userAvatar").src = record.photo_link;
      refreshData(userDocNo);
    };

    function refreshData(docNo) {
      fetch(`${SCRIPT_URL}?action=getShifts&userDocNo=${docNo}`)
        .then(r => r.json())
        .then(res => {
          if(res.ok) {
            renderAvailable(res.allShifts, res.myUpcomingEvents);
            renderBooked(res.myUpcomingEvents);
            document.getElementById('sync-loader').style.display = 'none';
          }
        });
    }

    function renderAvailable(shifts, bookings) {
      const container = document.getElementById('available-view');
      container.innerHTML = '';
      const dates = [...new Set(shifts.map(s => s.date))];
      
      dates.forEach(date => {
        container.innerHTML += `<div class="date-label">${date}</div>`;
        // Check if user already has a booking on this date
        const hasBookingToday = bookings.some(b => b.date === date && b.status !== 'CANCELLED');

        shifts.filter(s => s.date === date).forEach(s => {
          const isMyShift = bookings.some(b => b.shift_id === s.id && b.status !== 'CANCELLED');
          const isFull = s.slotsLeft <= 0;
          
          // Logic: If I have a booking today, and THIS isn't it, lock this card.
          const isLockedByPolicy = hasBookingToday && !isMyShift;

          container.innerHTML += `
            <div class="card ${isLockedByPolicy ? 'locked' : ''}">
              <div class="card-header">
                <h3 class="card-title">${s.dept}</h3>
                <span class="status-pill ${isMyShift ? 'pill-confirmed' : (isLockedByPolicy ? 'pill-locked' : 'pill-open')}">
                  ${isMyShift ? 'Confirmed' : (isLockedByPolicy ? 'Shift Taken' : (isFull ? 'Full' : s.slotsLeft + ' Left'))}
                </span>
              </div>
              <div class="card-meta">
                <div class="meta-row"><i class="ph ph-clock"></i> ${s.time}</div>
              </div>
              ${isMyShift ? 
                `<button class="btn-exec" style="background:#f1f5f9; color:#94a3b8; cursor:default;">Active Selection ✅</button>` : 
                (isLockedByPolicy ? 
                  `<button class="btn-exec btn-locked">Locked</button>` : 
                  `<button class="btn-exec" onclick="handleBooking('${s.id}', '${s.date}', '${s.dept}', '${s.time}')">Confirm Duty</button>`
                )
              }
            </div>`;
        });
      });
    }

    function renderBooked(bookings) {
      const container = document.getElementById('booked-view');
      container.innerHTML = '<div class="date-label">My Registered Schedule</div>';
      if (bookings.length === 0) { container.innerHTML += '<p style="text-align:center; padding:50px; color:#94a3b8;">No duties registered.</p>'; return; }
      bookings.forEach(b => {
        container.innerHTML += `
          <div class="card">
            <div class="card-header"><h3 class="card-title">${b.dept}</h3><span class="status-pill pill-confirmed">${b.status}</span></div>
            <div class="card-meta"><div class="meta-row"><i class="ph ph-calendar"></i> ${b.date}</div><div class="meta-row"><i class="ph ph-clock"></i> ${b.time}</div></div>
            <button class="btn-exec btn-remove" onclick="cancelBooking('${b.shift_id}')">Cancel Duty</button>
          </div>`;
      });
    }

    function switchTab(index) {
      document.getElementById('available-view').style.display = index === 0 ? 'block' : 'none';
      document.getElementById('booked-view').style.display = index === 1 ? 'block' : 'none';
      const items = document.querySelectorAll('.nav-item');
      items.forEach((it, i) => it.classList.toggle('active', i === index));
    }

    function handleBooking(id, date, dept, time) {
      const docNo = localStorage.getItem("mcl_doc_no");
      if (!confirm("Confirm registration for " + dept + "?")) return;
      fetch(`${SCRIPT_URL}?action=submit&shiftId=${id}&date=${date}&dept=${dept}&time=${time}&userDocNo=${docNo}`)
        .then(() => window.location.reload());
    }

    function cancelBooking(shiftId) {
      const docNo = localStorage.getItem("mcl_doc_no");
      if (!confirm("Cancel this duty?")) return;
      fetch(`${SCRIPT_URL}?action=cancel&shiftId=${shiftId}&userDocNo=${docNo}`)
        .then(() => window.location.reload());
    }
  </script>
</body>
</html>
