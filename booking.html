<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITEC — Casual Labour Portal</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
    :root {
      /* Core Branding */
      --mitec-blue: #0D1B3E;      /* Midnight Sapphire */
      --mitec-light: #1D2D50;     /* Lighter shade for gradients */
      
      /* UI Accents - Muted Professional Tones */
      --accent-steel: #3E5C76;    /* Professional grey-blue */
      --accent-bronze: #94763D;   /* Premium status */
      --accent-crimson: #8E3A3A;  /* Subtle alert */
      
      /* Surface & Text */
      --bg-base: #F1F3F6;         /* Neutral slate background */
      --card-bg: #ffffff;
      --text-main: #101828;       /* Deep obsidian */
      --text-muted: #667085;      /* Slate grey */
      --border-light: #D0D5DD;
      
      /* Elevation */
      --shadow-float: 0 4px 12px rgba(13, 27, 62, 0.08);
      --font-main: 'Trebuchet MS', sans-serif;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    
    body { 
      margin: 0; padding: 0; 
      background-color: var(--bg-base); 
      font-family: var(--font-main); 
      color: var(--text-main); 
      min-height: 100vh; 
      padding-bottom: 90px; 
    }

    .container { max-width: 450px; margin: 0 auto; padding: 20px; }

    /* Premium Header */
    .header { 
      text-align: center; 
      padding: 16px 0; 
      background: #fff; 
      border-bottom: 2px solid var(--mitec-blue); 
      position: sticky; top: 0; z-index: 100; 
    }
    
    .brand-img { height: 20px; width: auto; filter: brightness(1.1); }
    
    /* Profile Section - Luxury Gradient */
    .profile-card { 
      background: linear-gradient(135deg, var(--mitec-blue) 0%, var(--mitec-light) 100%); 
      border-radius: 12px; 
      padding: 20px; 
      display: flex; 
      align-items: center; 
      gap: 16px; 
      margin: 15px 0 25px 0; 
      color: #fff; 
      box-shadow: var(--shadow-float); 
    }

    .avatar { 
      width: 52px; height: 52px; 
      border-radius: 50%; 
      border: 2px solid rgba(255,255,255,0.15); 
      object-fit: cover; 
    }

    /* Date Dividers - Tighter & Cleaner */
    .date-divider { 
      font-size: 10px; font-weight: 800; 
      color: var(--text-muted); 
      margin: 30px 0 12px 5px; 
      text-transform: uppercase; 
      letter-spacing: 1.5px; 
      display: flex; align-items: center; gap: 10px; 
    }
    .date-divider::after { content: ""; flex: 1; height: 1px; background: var(--border-light); }

    /* Shift Cards - "Floating" Look */
    .shift-card { 
      background: var(--card-bg); 
      border: 1px solid rgba(208, 213, 221, 0.5); 
      border-radius: 12px; 
      padding: 20px; 
      margin-bottom: 14px; 
      box-shadow: var(--shadow-float); 
      position: relative;

    /* Ghost Tags - No more heavy blocks of color */

  <style>
    :root {
      /* Core Branding */
      --mitec-blue: #0B162C;      /* Midnight Sapphire */
      --mitec-gradient: linear-gradient(135deg, #0B162C 0%, #1C2B4B 100%);
      
      /* UI Accents */
      --accent-slate: #4A6572;    /* Professional Steel */
      --accent-bronze: #A68966;   /* Premium Gold */
      --accent-muted-red: #964B4B; /* Muted Cancellation */
      
      /* Backgrounds */
      --bg-base: #F8FAFC;         /* Clean Ice White */
      --card-bg: #ffffff;
      --text-main: #1E293B;       /* Deep Slate Text */
      --text-muted: #64748B;      /* Cool Gray */
      --border-light: #E2E8F0;
      
      /* Effects */
      --shadow-premium: 0 4px 20px rgba(11, 22, 44, 0.05);
      --font-main: 'Trebuchet MS', sans-serif;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    
    body { 
      margin: 0; padding: 0; 
      background-color: var(--bg-base); 
      font-family: var(--font-main); 
      color: var(--text-main); 
      padding-bottom: 100px; 
    }

    .container { max-width: 450px; margin: 0 auto; padding: 20px; }

    /* Clean Header */
    .header { 
      text-align: center; 
      padding: 18px 0; 
      background: #fff; 
      border-bottom: 1px solid var(--border-light); 
      position: sticky; top: 0; z-index: 100; 
    }
    
    .brand-img { height: 22px; width: auto; filter: contrast(1.1); }
    
    /* Executive Profile - No bright blue, use Deep Gradient */
    .profile-card { 
      background: var(--mitec-gradient); 
      border-radius: 12px; 
      padding: 24px 20px; 
      display: flex; 
      align-items: center; 
      gap: 16px; 
      margin: 15px 0 30px 0; 
      color: #fff; 
      box-shadow: 0 10px 25px rgba(11, 22, 44, 0.15); 
    }

    .avatar { 
      width: 52px; height: 52px; 
      border-radius: 50%; 
      border: 2px solid rgba(255,255,255,0.1); 
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    .profile-name { font-size: 16px; letter-spacing: -0.3px; }

    /* Date Dividers */
    .date-divider { 
      font-size: 10px; font-weight: 800; 
      color: var(--text-muted); 
      margin: 35px 0 15px 5px; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      display: flex; align-items: center; gap: 12px; 
    }
    .date-divider::after { content: ""; flex: 1; height: 1px; background: var(--border-light); }

    /* Shift Cards - Modern & Flat */
    .shift-card { 
      background: var(--card-bg); 
      border: 1px solid var(--border-light); 
      border-radius: 12px; 
      padding: 22px; 
      margin-bottom: 16px; 
      box-shadow: var(--shadow-premium); 
      transition: transform 0.2s;
    }
    
    /* Tags - Subtle Ghost Style */
    .status-tag { 
      font-size: 8px; font-weight: 800; 
      padding: 4px 10px; border-radius: 4px; 
      text-transform: uppercase; 
      position: absolute; top: 22px; right: 22px; 
      letter-spacing: 0.5px;
    }
    .tag-open { background: #F1F5F9; color: var(--accent-slate); border: 1px solid #CBD5E1; }
    .tag-booked { background: #F0F9FF; color: #0369A1; border: 1px solid #B9E6FE; }
    .tag-wait { background: #FFFBEB; color: #92400E; border: 1px solid #FDE68A; }
    .tag-locked { background: #F8FAFC; color: #94A3B8; border: 1px solid #E2E8F0; }

    .shift-title { font-size: 18px; font-weight: 700; color: var(--mitec-blue); margin-bottom: 8px; }
    .shift-meta { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
    
    /* Buttons - Refined & Heavy */
    .btn-action { 
      width: 100%; height: 48px; 
      border-radius: 8px; 
      background: var(--mitec-blue); 
      color: #fff; font-size: 14px; font-weight: 700; 
      border: none; cursor: pointer; 
      margin-top: 20px;
      letter-spacing: 0.5px;
    }
    
    .btn-booked { background: var(--accent-slate) !important; }
    .btn-locked { background: #F1F5F9 !important; color: #94A3B8 !important; border: 1px solid #E2E8F0 !important; }
    
    .btn-cancel { 
      margin-top: 15px; background: transparent; 
      border: 1px solid #FCA5A5; color: var(--accent-muted-red); 
      border-radius: 8px; padding: 12px; width: 100%; 
      font-size: 12px; font-weight: 700; cursor: pointer; 
    }

    /* Bottom Navigation - Glassmorphism */
    nav.bottom-nav { 
      position: fixed; bottom: 0; width: 100%; 
      background: rgba(255, 255, 255, 0.9); 
      backdrop-filter: blur(12px);
      display: flex; justify-content: space-around; 
      padding: 12px 0 30px 0; 
      border-top: 1px solid var(--border-light); 
      z-index: 100; 
    }
    .nav-item { color: #94A3B8; font-size: 9px; font-weight: 700; letter-spacing: 1px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex: 1; }
    .nav-item.active { color: var(--mitec-blue); }

    #sync-loader { background: #fff; color: var(--mitec-blue); }
  </style>


</head>
<body>

  <div id="sync-loader">
    <i class="ph ph-circle-notch ph-spin" style="font-size: 40px; margin-bottom: 10px;"></i>
    Syncing Portal...
  </div>

  <header class="header">
    <img class="brand-img" src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC">
  </header>

  <div class="container">
    <div class="profile-card">
      <img id="userAvatar" class="avatar" src="https://via.placeholder.com/100" alt="Avatar">
      <div class="profile-info">
        <span style="font-size:10px; text-transform:uppercase; opacity:0.7;">Casual Labour Portal</span>
        <h2 id="userNameDisplay" class="profile-name">Staff Member</h2>
      </div>
    </div>

    <div id="available-page"></div>
    <div id="booked-page" style="display:none;"></div>
    <div id="history-page" style="display:none; text-align:center; padding-top:50px; color:var(--text-muted);">
      <i class="ph ph-clock-counter-clockwise" style="font-size:48px; opacity:0.2;"></i>
      <p>Attendance history will appear here.</p>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab(0)"><i class="ph ph-magnifying-glass" style="font-size:22px"></i><span>Available</span></div>
    <div class="nav-item" onclick="switchTab(1)"><i class="ph ph-calendar-check" style="font-size:22px"></i><span>Booked</span></div>
    <div class="nav-item" onclick="switchTab(2)"><i class="ph ph-clock-counter-clockwise" style="font-size:22px"></i><span>History</span></div>
  </nav>

  <script>
    // UPDATE THIS URL AFTER NEW DEPLOYMENT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQO2wNLYqbclyen6E8ermntNGuAJZyMosl7t7HFbgvyhWKRYEHwyqnyOyesoX3YdOH/exec";

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");
      
      // SECURITY SHIELD: Check if user exists
      if (!userDocNo) {
        document.getElementById('sync-loader').innerHTML = "Unauthorized Access.<br><br><button onclick='window.location.href=\"index.html\"' style='padding:10px 20px;'>Return to Login</button>";
        return;
      }

      const record = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
      document.getElementById("userNameDisplay").textContent = record.full_name || "Staff Member";
      if (record.photo_link) document.getElementById("userAvatar").src = record.photo_link;

      refreshData(userDocNo);
    };

    function refreshData(docNo) {
      fetch(`${SCRIPT_URL}?action=getShifts&userDocNo=${docNo}`)
        .then(r => r.json())
        .then(res => {
          if(res.ok) {
            renderAvailable(res.allShifts, res.myUpcomingEvents);
            renderBooked(res.myUpcomingEvents);
          } else if (res.error === "NOT_REGISTERED") {
             // AUTO LOGOUT FOR UNAUTHORIZED USERS
             alert("Your Document Number is not registered. Access Denied.");
             localStorage.clear();
             window.location.href = "https://casualmitec.online";
          }
          document.getElementById('sync-loader').style.display = 'none';
        })
        .catch(() => {
          document.getElementById('sync-loader').innerHTML = "Connection Error.<br>Please ensure you are connected to the internet.";
        });
    }

    function renderAvailable(allShifts, myBookings) {
      const container = document.getElementById('available-page');
      container.innerHTML = '';
      const dates = [...new Set(allShifts.map(s => s.date))];
      
      dates.forEach(date => {
        container.innerHTML += `<div class="date-divider">${date}</div>`;
        allShifts.filter(s => s.date === date).forEach(s => {
          const booking = myBookings.find(b => b.shift_id === s.id);
          const isSelected = !!booking;
          const isWaitlisted = booking && booking.status === "WAITLIST";
          const isDateLocked = myBookings.some(b => b.date === s.date);
          
          let statusText = "Open";
          let btnText = "Book Now";
          let btnClass = "";
          let isDisabled = false;

          if (isSelected) {
            statusText = isWaitlisted ? "On Waitlist" : "Booked";
            btnText = isWaitlisted ? "Waitlist Confirmed" : "My Selection ✔️";
            btnClass = "btn-booked";
            isDisabled = true;
          } else if (isDateLocked) {
            statusText = "Unavailable";
            btnText = "Day Locked";
            btnClass = "btn-locked";
            isDisabled = true;
          } else if (s.slotsLeft <= 0) {
            statusText = "Full";
          }

          container.innerHTML += `
            <div class="shift-card">
              <span class="status-tag ${isSelected ? (isWaitlisted ? 'tag-wait' : 'tag-booked') : (isDateLocked ? 'tag-locked' : 'tag-open')}">${statusText}</span>
              <h3 class="shift-title">${s.dept}</h3>
              <div class="shift-meta"><i class="ph ph-clock"></i> ${s.time} | ${s.slotsLeft} spots left</div>
              <button class="btn-action ${btnClass}" 
                ${isDisabled ? 'disabled' : ''} 
                onclick="handleBooking('${s.id}', '${s.date}', '${s.dept}', '${s.time}', this)">
                ${btnText}
              </button>
            </div>`;
        });
      });
    }

    function renderBooked(myBookings) {
      const container = document.getElementById('booked-page');
      container.innerHTML = '<div class="date-divider">Upcoming Shifts</div>';
      
      if (myBookings.length === 0) {
        container.innerHTML += `<div style="text-align:center; padding:40px; color:var(--text-muted);">No active bookings.</div>`;
        return;
      }

      myBookings.forEach(b => {
        const isWait = b.status === "WAITLIST";
        container.innerHTML += `
          <div class="shift-card" style="border-left: 4px solid ${isWait ? 'var(--accent-gold)' : 'var(--accent-teal)'};">
            <span class="status-tag ${isWait ? 'tag-wait' : 'tag-booked'}">${isWait ? 'Waitlist' : 'Confirmed'}</span>
            <h3 class="shift-title">${b.dept}</h3>
            <div class="shift-meta"><i class="ph ph-calendar"></i> ${b.date}</div>
            <div class="shift-meta"><i class="ph ph-clock"></i> ${b.time}</div>
            <button class="btn-cancel" onclick="handleCancel('${b.shift_id}', this)">Cancel Booking</button>
          </div>`;
      });
    }

    function switchTab(index) {
      const pages = ['available-page', 'booked-page', 'history-page'];
      const navs = document.querySelectorAll('.nav-item');
      pages.forEach((p, i) => {
        document.getElementById(p).style.display = (i === index) ? 'block' : 'none';
        navs[i].classList.toggle('active', i === index);
      });
    }

    function handleBooking(id, date, dept, time, btn, isWaitlist = false) {
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");

      if (!isWaitlist && !confirm(`Confirm booking for ${dept}?`)) return;

      btn.innerText = "Processing...";
      btn.disabled = true;

      fetch(`${SCRIPT_URL}?action=submit&shiftId=${id}&date=${date}&dept=${dept}&time=${time}&userDocNo=${userDocNo}&isWaitlist=${isWaitlist}`)
        .then(r => r.json())
        .then(res => {
          if (res.ok === "FULL") {
            if (confirm(res.message)) handleBooking(id, date, dept, time, btn, true);
            else { btn.innerText = "Book Now"; btn.disabled = false; }
          } else {
            alert(res.message);
            if (res.ok) window.location.reload();
            else { btn.innerText = "Book Now"; btn.disabled = false; }
          }
        });
    }

    function handleCancel(shiftId, btn) {
      const urlParams = new URLSearchParams(window.location.search);
      const userDocNo = urlParams.get('id') || localStorage.getItem("mcl_doc_no");

      if (!confirm("Cancel this booking? This action cannot be undone.")) return;

      btn.innerText = "Cancelling...";
      btn.disabled = true;

      fetch(`${SCRIPT_URL}?action=cancel&shiftId=${shiftId}&userDocNo=${userDocNo}`)
        .then(r => r.json())
        .then(res => {
          alert(res.message);
          if (res.ok) window.location.reload();
          else { btn.innerText = "Cancel Booking"; btn.disabled = false; }
        });
    }
  </script>
</body>
</html>
