<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MITEC - Casual Labour Recruitment</title>
    
    <link rel="icon" class="icon" href="https://mitec.com.my/static/img/logos/logo-footer.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Phosphor Icons for side navigation -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --md-surface: #f4f6f9;
            --md-surface-container: #ffffff;
            --md-on-surface: #1d1d1f;
            --md-on-surface-variant: #51525c;
            --md-outline: #e1e4ea; 
            
            --mitec-blue: #1B365D;         
            --mitec-blue-hover: #2D68C4;   
            --mitec-accent: #0f4a82;       
            
            --md-font: 'Inter', -apple-system, sans-serif;
            --brand-font: 'Trebuchet MS', Arial, sans-serif;
            
            --danger-red: #dc2626;
            --radius-main: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--md-font); }
        body { background-color: var(--md-surface); color: var(--md-on-surface); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .portal-container { 
            width: 100%; 
            max-width: 520px; 
            background: var(--md-surface-container); 
            border-radius: var(--radius-main); 
            border: 1px solid var(--md-outline); 
            padding: 24px; 
            box-shadow: 0 10px 25px -5px rgba(27, 54, 93, 0.08); 
        }

        .brand-header-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .brand-header-logo img {
            max-width: 160px;
            height: auto;
        }

        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .header h2 { font-size: 1.35rem; font-weight: 700; color: var(--mitec-blue); }
        .header p { font-size: 0.85rem; color: var(--md-on-surface-variant); margin-top: 2px; }
        
        .btn-logout { background-color: #f1f5f9; color: var(--md-on-surface); border: 1px solid var(--md-outline); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: background 0.2s; }
        .btn-logout:hover { background-color: #e2e8f0; }
        
        .tab-bar { display: flex; background-color: #f1f5f9; padding: 4px; border-radius: 10px; margin-bottom: 20px; gap: 4px; border: 1px solid var(--md-outline); }
        .tab-btn { flex: 1; padding: 9px 4px; border: none; background: transparent; font-weight: 600; font-size: 0.8rem; color: var(--md-on-surface-variant); cursor: pointer; border-radius: 8px; text-align: center; transition: all 0.2s; }
        .tab-btn.active { background-color: var(--mitec-blue); color: #ffffff; box-shadow: 0 2px 4px rgba(27, 54, 93, 0.15); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--md-on-surface-variant); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
        .input-field, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--md-outline); background-color: #ffffff; font-size: 0.95rem; color: var(--md-on-surface); outline: none; transition: border-color 0.2s; }
        .input-field:focus, select:focus { border-color: var(--mitec-blue-hover); box-shadow: 0 0 0 3px rgba(45, 104, 196, 0.15); }
        
        .btn-primary { width: 100%; background: linear-gradient(135deg, var(--mitec-blue), var(--mitec-accent)); color: #ffffff; border: none; padding: 14px; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .btn-primary:hover { opacity: 0.95; }

        .btn-action { background-color: var(--mitec-blue-hover); color: #ffffff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
        .btn-danger { background-color: var(--danger-red); color: #ffffff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; }
        th { text-align: left; padding: 10px 8px; color: var(--md-on-surface-variant); border-bottom: 2px solid var(--md-outline); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 10px 8px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        
        /* SHIFT CARDS UI */
        .date-group-header {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--mitec-blue);
            margin: 18px 0 10px 0;
            letter-spacing: 0.5px;
            border-bottom: 1px dashed var(--md-outline);
            padding-bottom: 4px;
        }
        .shift-card {
            background: #ffffff;
            border: 1px solid var(--md-outline);
            border-radius: var(--radius-main);
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 12px rgba(27, 54, 93, 0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .shift-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .shift-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--mitec-blue);
        }
        .badge-status {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-available {
            background-color: #eff6ff;
            color: var(--mitec-blue-hover);
        }
        .badge-full {
            background-color: #fef2f2;
            color: var(--danger-red);
        }
        .shift-info-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            color: var(--md-on-surface-variant);
            margin-bottom: 10px;
            font-weight: 600;
        }
        .shift-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0 12px 0;
            background: var(--md-surface);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #f1f5f9;
        }
        .shift-meta-item {
            display: flex;
            flex-direction: column;
        }
        .shift-meta-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--md-on-surface-variant);
            font-weight: 700;
            letter-spacing: 0.4px;
        }
        .shift-meta-val {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--md-on-surface);
            margin-top: 2px;
        }
        .card-group-select {
            padding: 8px 10px !important;
            font-size: 0.82rem !important;
            margin-bottom: 12px;
            border-radius: 6px !important;
        }
        .btn-book-card {
            width: 100%;
            background-color: var(--mitec-blue);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-book-card:hover {
            background-color: var(--mitec-blue-hover);
        }
        .btn-book-card:disabled {
            background-color: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
        }

        .footer-brand { 
            margin-top: 36px; 
            font-family: var(--brand-font); 
            font-size: 0.72rem; 
            font-weight: 700; 
            color: #94a3b8; 
            letter-spacing: 2px; 
            text-align: center; 
            text-transform: uppercase; 
        }
    </style>
</head>
<body>

<div class="portal-container">

    <div class="brand-header-logo">
        <img src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC Logo">
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginView">
        <div class="header">
            <div>
                <h2>Casual Labour Portal</h2>
                <p>Enter your Doc No / NRIC to continue</p>
            </div>
        </div>
        <div class="form-group">
            <label>Doc No / NRIC</label>
            <input type="text" id="loginDocNo" placeholder="e.g. 060109030073" class="input-field" />
        </div>
        <button class="btn-primary" onclick="handleLogin()">Log In</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="portalView" style="display: none;">
        <div class="header">
            <div>
                <h2 id="welcomeText">Portal</h2>
                <p id="userRoleDisplay" style="color: var(--mitec-blue-hover); font-weight: 700; text-transform: uppercase; font-size: 0.75rem;"></p>
            </div>
            <button class="btn-logout" onclick="logout()">Log Out</button>
        </div>

        <div id="tabBar" class="tab-bar"></div>
        <div id="tabContainer"></div>
    </div>

</div>

<div class="footer-brand">
    MALAYSIA INTERNATIONAL TRADE AND EXHIBITION CENTRE
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyiCOzwEAJ-AXuC0ou34ZwYDLwiwsPAyoPnrOixQrfzHyd99lY7uREz67kKw3NlfG10iw/exec"; 

    let currentUser = null;
    let cachedShifts = [];
    let cachedGroups = ["INDIVIDUAL"];

    window.onload = function() {
        const saved = sessionStorage.getItem("currentUser");
        if (saved) {
            currentUser = JSON.parse(saved);
            renderRoleDashboard();
        }
    };

    function handleLogin() {
        const docNoInput = document.getElementById("loginDocNo").value.trim();
        if (!docNoInput) return alert("Please enter your Doc No / NRIC.");

        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "login", data: { docNo: docNoInput } })
        })
        .then(res => res.json())
        .then(res => {
            if (res.success) {
                currentUser = res;
                sessionStorage.setItem("currentUser", JSON.stringify(res));
                renderRoleDashboard();
            } else {
                alert(res.message);
            }
        });
    }

    function renderRoleDashboard() {
        document.getElementById("loginView").style.display = "none";
        document.getElementById("portalView").style.display = "block";
        document.getElementById("welcomeText").textContent = currentUser.name || "Worker Portal";
        document.getElementById("userRoleDisplay").textContent = "Role: " + (currentUser.role || "Worker");

        const tabBar = document.getElementById("tabBar");
        const tabContainer = document.getElementById("tabContainer");

        if (currentUser.role === "superadmin") {
            tabBar.innerHTML = `
                <button class="tab-btn active" onclick="switchTab('adminShifts', this)">Shifts</button>
                <button class="tab-btn" onclick="switchTab('adminAssignRecruiter', this)">Assign Recruiter</button>
                <button class="tab-btn" onclick="switchTab('adminMaster', this)">Master DB</button>
            `;
            tabContainer.innerHTML = `
                <div id="adminShifts" class="tab-content active">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <span style="font-size:0.85rem; color:var(--md-on-surface-variant);">Manage event shifts</span>
                        <button class="btn-action" onclick="openShiftForm()">+ Add Shift</button>
                    </div>

                    <div id="shiftTableContainer">
                        <table>
                            <thead><tr><th>Shift ID</th><th>Event</th><th>Actions</th></tr></thead>
                            <tbody id="adminShiftsTableBody"><tr><td colspan="3">Loading...</td></tr></tbody>
                        </table>
                    </div>

                    <div id="shiftFormContainer" style="display:none; margin-top:15px; border-top:1px solid var(--md-outline); padding-top:15px;">
                        <h3 id="shiftFormTitle" style="font-size:0.95rem; margin-bottom:10px; color:var(--mitec-blue);">Create New Shift</h3>
                        <input type="hidden" id="editShiftId">
                        
                        <div class="form-group">
                            <label>Event Name</label>
                            <input type="text" id="eventName" placeholder="e.g. F&N Annual Dinner" class="input-field">
                        </div>
                        <div class="form-group">
                            <label>Shift Date</label>
                            <input type="date" id="shiftDate" class="input-field">
                        </div>
                        <div class="form-group">
                            <label>Start Time</label>
                            <input type="text" id="startTime" placeholder="08:00 AM" class="input-field">
                        </div>
                        <div class="form-group">
                            <label>Hourly Rate / Pay (RM)</label>
                            <input type="number" id="hourlyRate" placeholder="e.g. 100" class="input-field">
                        </div>
                        <div class="form-group">
                            <label>Total Pax Required</label>
                            <input type="number" id="totalPax" placeholder="e.g. 50" class="input-field">
                        </div>
                        <div class="form-group">
                            <label>Payment Method</label>
                            <input type="text" id="paymentMethod" placeholder="e.g. Bank Transfer" class="input-field">
                        </div>

                        <div style="display:flex; gap:8px;">
                            <button class="btn-primary" style="flex:1;" onclick="saveShift()">Save Shift</button>
                            <button class="btn-logout" onclick="closeShiftForm()">Cancel</button>
                        </div>
                    </div>
                </div>

                <!-- ASSIGN RECRUITER TAB FOR SUPERADMIN -->
                <div id="adminAssignRecruiter" class="tab-content">
                    <div style="background: var(--md-surface); padding: 14px; border-radius: 8px; border: 1px solid var(--md-outline); margin-bottom: 18px;">
                        <h3 style="font-size:0.9rem; margin-bottom:12px; color:var(--mitec-blue); font-weight:700;">Assign Recruiter to Shift</h3>
                        <div class="form-group">
                            <label>Worker Doc No / NRIC</label>
                            <input type="text" id="assignDocNo" placeholder="e.g. 060109030073" class="input-field">
                        </div>
                        <div class="form-group">
                            <label>Select Active Shift</label>
                            <select id="assignShiftSelect" class="input-field"><option value="">Loading shifts...</option></select>
                        </div>
                        <button class="btn-primary" onclick="assignRecruiterDirectly()">Assign Worker</button>
                    </div>

                    <h3 style="font-size:0.85rem; color:var(--md-on-surface-variant); margin-bottom:8px; font-weight:700;">Active Assignments</h3>
                    <table>
                        <thead><tr><th>Doc No</th><th>Shift</th><th>Status</th></tr></thead>
                        <tbody id="recruiterListBody"><tr><td colspan="3">Loading...</td></tr></tbody>
                    </table>
                </div>

                <div id="adminMaster" class="tab-content">
                    <table>
                        <thead><tr><th>Name</th><th>Phone</th><th>Date</th><th>Time</th><th>Group</th></tr></thead>
                        <tbody id="masterBookingTable"><tr><td colspan="5">Loading...</td></tr></tbody>
                    </table>
                </div>
            `;
            loadAdminShiftsTable();
            loadAdminAssignShiftsDropdown();
            loadActiveRecruitersList();
            loadMasterRecords();

        } else if (currentUser.role === "recruiter") {
            tabBar.innerHTML = `
                <button class="tab-btn active" onclick="switchTab('recSquad', this)">My Squad</button>
                <button class="tab-btn" onclick="switchTab('recBook', this)">Book Shift</button>
            `;
            tabContainer.innerHTML = `
                <div id="recSquad" class="tab-content active">
                    <p style="font-size:0.85rem; margin-bottom:10px;"><strong>Group:</strong> ${currentUser.groupName || 'Squad'}</p>
                    <table>
                        <thead><tr><th>Worker Name</th><th>Phone</th><th>Date</th><th>Time</th></tr></thead>
                        <tbody id="squadTable"><tr><td colspan="4">Loading...</td></tr></tbody>
                    </table>
                </div>
                <div id="recBook" class="tab-content"><div id="workerBookingUI"></div></div>
            `;
            loadSquadMembers();
            renderWorkerBookingUI();

        } else {
            // WORKER VIEW: EXACTLY 3 TABS (Book Shift, My Bookings, Acceptance)
            tabBar.innerHTML = `
                <button class="tab-btn active" onclick="switchTab('workBook', this)">Book Shift</button>
                <button class="tab-btn" onclick="switchTab('workHistory', this)">My Bookings</button>
                <button class="tab-btn" onclick="switchTab('workAccept', this)">Acceptance</button>
            `;
            tabContainer.innerHTML = `
                <!-- TAB 1: BOOK SHIFT -->
                <div id="workBook" class="tab-content active">
                    <div id="workerBookingUI"></div>
                </div>

                <!-- TAB 2: MY BOOKINGS -->
                <div id="workHistory" class="tab-content">
                    <table>
                        <thead><tr><th>Date</th><th>Time</th><th>Group</th><th>Status</th></tr></thead>
                        <tbody id="historyTableBody"><tr><td colspan="4">Loading...</td></tr></tbody>
                    </table>
                </div>
                
                <!-- TAB 3: GROUP ACCEPTANCE TABLE FOR ASSIGNED WORKER -->
                <div id="workAccept" class="tab-content">
                    <p style="font-size:0.8rem; color:var(--md-on-surface-variant); margin-bottom:12px; font-weight:600;">Shift assignments designated for your NRIC / Doc No:</p>
                    
                    <table>
                        <thead><tr><th>Shift</th><th>Action</th></tr></thead>
                        <tbody id="workerAssignedTableBody"><tr><td colspan="2">Loading assigned shifts...</td></tr></tbody>
                    </table>

                    <!-- MODAL / FORM TO COMPLETE APPLICATION -->
                    <div id="acceptanceFormContainer" style="display:none; margin-top:20px; background: var(--md-surface); padding: 16px; border-radius: var(--radius-main); border: 1px solid var(--md-outline);">
                        <h3 id="acceptFormTitle" style="font-size:0.95rem; margin-bottom:12px; color:var(--mitec-blue); font-weight:800;">Complete Group Application</h3>
                        <input type="hidden" id="acceptShiftId">
                        
                        <div class="form-group">
                            <label>Group / Squad Name</label>
                            <input type="text" id="acceptGroupName" placeholder="e.g. SQUAD_ALPHA" class="input-field">
                        </div>
                        <div class="form-group">
                            <label>Target Pax Quota</label>
                            <input type="number" id="acceptPaxNo" placeholder="e.g. 15" class="input-field">
                        </div>
                        <div style="display:flex; gap:8px;">
                            <button class="btn-primary" style="flex:1;" onclick="submitGroupAcceptance()">Submit Application</button>
                            <button class="btn-logout" onclick="closeAcceptanceForm()">Cancel</button>
                        </div>
                    </div>
                </div>
            `;
            renderWorkerBookingUI();
            loadWorkerHistory();
            loadAssignedShiftsForWorker();
        }
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
        document.getElementById(tabId).classList.add("active");
        btn.classList.add("active");
    }

    function loadAdminShiftsTable() {
        fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getShifts" }) })
        .then(r => r.json()).then(res => {
            const tbody = document.getElementById("adminShiftsTableBody");
            if (!tbody) return;
            tbody.innerHTML = "";
            if (res.success && res.shifts && res.shifts.length > 0) {
                cachedShifts = res.shifts;
                res.shifts.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${s.shiftId}</strong></td>
                            <td>${s.eventName}</td>
                            <td style="white-space:nowrap;">
                                <button class="btn-action" onclick="openShiftForm('${s.shiftId}')">Edit</button>
                                <button class="btn-danger" onclick="deleteShift('${s.shiftId}')">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>No active shifts found.</td></tr>";
            }
        });
    }

    function openShiftForm(shiftId = null) {
        document.getElementById("shiftFormContainer").style.display = "block";
        if (shiftId) {
            const shift = cachedShifts.find(s => s.shiftId === shiftId);
            if (!shift) return;
            document.getElementById("shiftFormTitle").textContent = "Edit Shift (" + shiftId + ")";
            document.getElementById("editShiftId").value = shift.shiftId;
            document.getElementById("eventName").value = shift.eventName || "";
            document.getElementById("shiftDate").value = shift.date || "";
            document.getElementById("startTime").value = shift.startTime || "";
            document.getElementById("hourlyRate").value = shift.rate || "";
            document.getElementById("totalPax").value = shift.totalPax || "";
            document.getElementById("paymentMethod").value = shift.paymentMethod || "Bank Transfer";
        } else {
            document.getElementById("shiftFormTitle").textContent = "Create New Shift";
            document.getElementById("editShiftId").value = "";
            document.getElementById("eventName").value = "";
            document.getElementById("shiftDate").value = "";
            document.getElementById("startTime").value = "";
            document.getElementById("hourlyRate").value = "";
            document.getElementById("totalPax").value = "";
            document.getElementById("paymentMethod").value = "Bank Transfer";
        }
    }

    function closeShiftForm() {
        document.getElementById("shiftFormContainer").style.display = "none";
    }

    function saveShift() {
        const editId = document.getElementById("editShiftId").value;
        const isUpdate = Boolean(editId);
        
        const payload = {
            action: isUpdate ? "updateShift" : "createShift",
            data: {
                shiftId: editId,
                eventName: document.getElementById("eventName").value.trim(),
                shiftDate: document.getElementById("shiftDate").value,
                startTime: document.getElementById("startTime").value.trim(),
                totalPax: document.getElementById("totalPax").value.trim(),
                rate: document.getElementById("hourlyRate").value.trim(),
                paymentMethod: document.getElementById("paymentMethod").value.trim() || "Bank Transfer"
            }
        };

        if (!payload.data.eventName || !payload.data.shiftDate) return alert("Please fill in Event Name and Date.");

        fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
        .then(r => r.json()).then(res => {
            alert(res.message);
            if (res.success) {
                closeShiftForm();
                loadAdminShiftsTable();
            }
        });
    }

    function deleteShift(shiftId) {
        if (!confirm("Are you sure you want to delete shift " + shiftId + "?")) return;
        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "deleteShift", data: { shiftId: shiftId } })
        })
        .then(r => r.json()).then(res => {
            alert(res.message);
            if (res.success) loadAdminShiftsTable();
        });
    }

    /* RENDER BOOKING UI WITH CARDS */
    function renderWorkerBookingUI() {
        const container = document.getElementById("workerBookingUI");
        if(!container) return;
        container.innerHTML = `
            <div id="shiftCardsContainer">
                <p style="text-align:center; color: var(--md-on-surface-variant); padding: 20px 0;">Loading active shifts...</p>
            </div>
        `;
        loadApprovedGroupsAndShifts();
    }

    function loadApprovedGroupsAndShifts() {
        fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getApprovedGroups", data: { shiftId: "" } }) })
        .then(r => r.json()).then(res => {
            cachedGroups = ["INDIVIDUAL"];
            if (res.success && res.groups) {
                res.groups.forEach(group => {
                    if (group.groupName && group.groupName !== "INDIVIDUAL" && !cachedGroups.includes(group.groupName)) {
                        cachedGroups.push(group.groupName);
                    }
                });
            }
            loadShiftCards();
        }).catch(() => {
            cachedGroups = ["INDIVIDUAL"];
            loadShiftCards();
        });
    }

    function loadShiftCards() {
        fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getShifts" }) })
        .then(r => r.json()).then(res => {
            const container = document.getElementById("shiftCardsContainer");
            if (!container) return;
            container.innerHTML = "";
            
            if (res.success && res.shifts && res.shifts.length > 0) {
                const grouped = {};
                res.shifts.forEach(shift => {
                    const dateKey = shift.date || "Upcoming Shifts";
                    if (!grouped[dateKey]) grouped[dateKey] = [];
                    grouped[dateKey].push(shift);
                });

                for (const [date, shifts] of Object.entries(grouped)) {
                    let sectionHtml = `<div class="date-group-header">${date}</div>`;
                    
                    shifts.forEach(s => {
                        const totalPax = parseInt(s.totalPax) || 0;
                        const bookedPax = parseInt(s.bookedPax) || 0;
                        const remaining = totalPax > 0 ? (totalPax - bookedPax) : null;
                        const isFull = remaining !== null && remaining <= 0;
                        
                        let badgeText = "AVAILABLE";
                        let badgeClass = "badge-available";

                        if (isFull) {
                            badgeText = "FULL";
                            badgeClass = "badge-full";
                        } else if (remaining !== null) {
                            badgeText = `${remaining} LEFT`;
                        }

                        const groupOptions = cachedGroups.map(g => `<option value="${g}">${g}</option>`).join("");

                        sectionHtml += `
                            <div class="shift-card">
                                <div class="shift-card-header">
                                    <div class="shift-title">${s.eventName || 'Shift ' + s.shiftId}</div>
                                    <span class="badge-status ${badgeClass}">${badgeText}</span>
                                </div>
                                
                                <div class="shift-info-row">
                                    <i class="ph ph-clock" style="font-size: 1.1rem; color: var(--md-on-surface-variant);"></i>
                                    <span>${s.startTime || 'TBA'}</span>
                                </div>

                                <div class="shift-meta-grid">
                                    <div class="shift-meta-item">
                                        <span class="shift-meta-label">Hourly / Pay Rate</span>
                                        <span class="shift-meta-val">RM ${s.rate || '0'}</span>
                                    </div>
                                    <div class="shift-meta-item">
                                        <span class="shift-meta-label">Payment</span>
                                        <span class="shift-meta-val">${s.paymentMethod || 'Bank Transfer'}</span>
                                    </div>
                                </div>

                                <div style="margin-bottom:10px;">
                                    <label class="shift-meta-label" style="display:block; margin-bottom:4px;">Group / Squad</label>
                                    <select id="groupSelect_${s.shiftId}" class="input-field card-group-select" ${isFull ? 'disabled' : ''}>
                                        ${groupOptions}
                                    </select>
                                </div>

                                <button class="btn-book-card" ${isFull ? 'disabled' : ''} onclick="submitCardBooking('${s.shiftId}')">
                                    ${isFull ? 'Full' : 'Book Now'}
                                </button>
                            </div>
                        `;
                    });
                    
                    container.innerHTML += sectionHtml;
                }
            } else {
                container.innerHTML = `<p style="text-align:center; color: var(--md-on-surface-variant); padding: 20px 0;">No active shifts available for booking.</p>`;
            }
        });
    }

    function submitCardBooking(shiftId) {
        const selectEl = document.getElementById(`groupSelect_${shiftId}`);
        const selectedGroup = selectEl ? selectEl.value : "INDIVIDUAL";

        if (!shiftId || !selectedGroup) return alert("Please select a valid group.");

        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ 
                action: "submitBooking", 
                data: { 
                    docNo: currentUser.docNo, 
                    workerName: currentUser.name, 
                    shiftId: shiftId, 
                    selectedGroup: selectedGroup 
                } 
            })
        }).then(r => r.json()).then(res => {
            alert(res.message);
            if (res.success) {
                if (currentUser.role === 'worker') loadWorkerHistory();
                loadApprovedGroupsAndShifts();
            }
        });
    }

    function loadWorkerHistory() {
        fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getHistory", data: { userDocNo: currentUser.docNo, userRole: currentUser.role, groupName: "" } }) })
        .then(r => r.json()).then(res => {
            const tbody = document.getElementById("historyTableBody");
            if(!tbody) return;
            tbody.innerHTML = "";
            if (res.success && res.records && res.records.length > 0) {
                res.records.forEach(rec => {
                    tbody.innerHTML += `<tr><td>${rec.shiftDate || 'N/A'}</td><td>${rec.shiftTime || 'N/A'}</td><td>${rec.group}</td><td>${rec.status || 'Confirmed'}</td></tr>`;
                });
            } else {
                tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>No bookings found.</td></tr>";
            }
        });
    }

    /* WORKER ASSIGNED SHIFTS TABLE & ACCEPTANCE FLOW */
    function loadAssignedShiftsForWorker() {
        fetch(API_URL, { 
            method: "POST", 
            headers: { "Content-Type": "text/plain;charset=utf-8" }, 
            body: JSON.stringify({ 
                action: "getWorkerAssignedShifts", 
                data: { docNo: currentUser.docNo } 
            }) 
        })
        .then(r => r.json()).then(res => {
            const tbody = document.getElementById("workerAssignedTableBody");
            if (!tbody) return;
            tbody.innerHTML = "";
            if (res.success && res.assignments && res.assignments.length > 0) {
                res.assignments.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${item.eventName || item.shiftId}</strong><br><span style="font-size:0.75rem; color:var(--md-on-surface-variant);">${item.shiftDate || ''}</span></td>
                            <td>
                                <button class="btn-action" onclick="openAcceptanceForm('${item.shiftId}', '${item.eventName || item.shiftId}')">Accept Shift</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = "<tr><td colspan='2' style='text-align:center;'>No assignments found for your account.</td></tr>";
            }
        }).catch(() => {
            const tbody = document.getElementById("workerAssignedTableBody");
            if(tbody) tbody.innerHTML = "<tr><td colspan='2' style='text-align:center;'>No assignments found for your account.</td></tr>";
        });
    }

    function openAcceptanceForm(shiftId, eventName) {
        document.getElementById("acceptanceFormContainer").style.display = "block";
        document.getElementById("acceptFormTitle").textContent = "Complete Application: " + eventName;
        document.getElementById("acceptShiftId").value = shiftId;
        document.getElementById("acceptGroupName").value = "";
        document.getElementById("acceptPaxNo").value = "";
    }

    function closeAcceptanceForm() {
        document.getElementById("acceptanceFormContainer").style.display = "none";
    }

    function submitGroupAcceptance() {
        const shiftId = document.getElementById("acceptShiftId").value;
        const groupName = document.getElementById("acceptGroupName").value.trim();
        const paxNo = document.getElementById("acceptPaxNo").value.trim();

        if (!shiftId || !groupName || !paxNo) return alert("Please fill in both Group Name and Target Pax Quota.");

        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                action: "submitAcceptance",
                data: {
                    docNo: currentUser.docNo,
                    shiftId: shiftId,
                    groupName: groupName,
                    paxNo: paxNo
                }
            })
        }).then(r => r.json()).then(res => {
            alert(res.message || "Acceptance form submitted successfully.");
            closeAcceptanceForm();
            loadAssignedShiftsForWorker();
        });
    }

    /* DIRECT ASSIGNMENT FLOW BY SUPERADMIN */
    function loadAdminAssignShiftsDropdown() {
        fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getShifts" }) })
        .then(r => r.json()).then(res => {
            const select = document.getElementById("assignShiftSelect");
            if (!select) return;
            select.innerHTML = '<option value="">-- Select Shift --</option>';
            if (res.success && res.shifts && res.shifts.length > 0) {
                res.shifts.forEach(s => {
                    select.innerHTML += `<option value="${s.shiftId}">${s.eventName} (${s.date || s.shiftId})</option>`;
                });
            }
        });
    }

    function assignRecruiterDirectly() {
        const docNo = document.getElementById("assignDocNo").value.trim();
        const shiftId = document.getElementById("assignShiftSelect").value;

        if (!docNo || !shiftId) return alert("Please enter Worker Doc No and select an Active Shift.");

        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ 
                action: "assignRecruiter", 
                data: { docNo: docNo, shiftId: shiftId } 
            })
        }).then(r => r.json()).then(res => {
            alert(res.message || "Worker assigned to shift successfully.");
            document.getElementById("assignDocNo").value = "";
            document.getElementById("assignShiftSelect").value = "";
            loadActiveRecruitersList();
        });
    }

    function loadActiveRecruitersList() {
        fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getApprovedGroups", data: { shiftId: "" } }) })
        .then(r => r.json()).then(res => {
            const tbody = document.getElementById("recruiterListBody");
            if(!tbody) return;
            tbody.innerHTML = "";
            if (res.success && res.groups && res.groups.length > 0) {
                res.groups.forEach(g => {
                    if(g.groupName !== "INDIVIDUAL") {
                        tbody.innerHTML += `<tr><td>${g.docNo || 'N/A'}</td><td>${g.shiftId || 'N/A'}</td><td><span style="color:var(--mitec-blue-hover); font-weight:700;">Assigned</span></td></tr>`;
                    }
                });
            } else {
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>No active recruiters assigned.</td></tr>";
            }
        });
    }

    function loadMasterRecords() {
        fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getHistory", data: { userDocNo: currentUser.docNo, userRole: "superadmin", groupName: "" } }) })
        .then(r => r.json()).then(res => {
            const tbody = document.getElementById("masterBookingTable");
            if(!tbody) return;
            tbody.innerHTML = "";
            if (res.success && res.records && res.records.length > 0) {
                res.records.forEach(r => {
                    tbody.innerHTML += `<tr><td>${r.name || r.docNo}</td><td>${r.phone || 'N/A'}</td><td>${r.shiftDate || 'N/A'}</td><td>${r.shiftTime || 'N/A'}</td><td>${r.group}</td></tr>`;
                });
            } else {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>No master records found.</td></tr>";
            }
        });
    }

    function loadSquadMembers() {
        fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getHistory", data: { userDocNo: currentUser.docNo, userRole: "recruiter", groupName: currentUser.groupName } }) })
        .then(r => r.json()).then(res => {
            const tbody = document.getElementById("squadTable");
            if(!tbody) return;
            tbody.innerHTML = "";
            if (res.success && res.records && res.records.length > 0) {
                res.records.forEach(r => {
                    tbody.innerHTML += `<tr><td>${r.name || r.docNo}</td><td>${r.phone || 'N/A'}</td><td>${r.shiftDate || 'N/A'}</td><td>${r.shiftTime || 'N/A'}</td></tr>`;
                });
            } else {
                tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>No squad members yet.</td></tr>";
            }
        });
    }

    function logout() {
        sessionStorage.clear();
        currentUser = null;
        document.getElementById("portalView").style.display = "none";
        document.getElementById("loginView").style.display = "block";
        document.getElementById("loginDocNo").value = "";
    }
</script>
