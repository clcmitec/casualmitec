<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITEC — Shift Booking</title>
  <style>
    :root {
      --platinum-bg: #F5F7FA;
      --slate-dark: #2C3E50;
      --slate-muted: #5D6D7E;
      --chrome-accent: #90A4AE;
      --white: #FFFFFF;
      --shadow: 0 8px 24px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      margin: 0;
      padding: 20px 16px 100px;
      background-color: var(--platinum-bg);
      font-family: "Trebuchet MS", -apple-system, sans-serif; /* Preserving brand font */
      color: var(--slate-dark);
    }

    .shell { max-width: 440px; margin: 0 auto; }

    .header-area { margin-bottom: 24px; }
    .back-link { 
      text-decoration: none; color: var(--slate-muted); font-size: 14px; 
      display: flex; align-items: center; gap: 5px; margin-bottom: 12px;
    }

    .page-title { font-size: 24px; font-weight: 800; margin: 0; color: var(--slate-dark); }
    .page-desc { font-size: 13px; color: var(--slate-muted); margin: 6px 0 20px; line-height: 1.4; }

    /* Platinum Shift Cards */
    .platinum-card {
      background: var(--white);
      border-radius: 24px;
      border-left: 6px solid var(--chrome-accent);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }
    .platinum-card:active { transform: scale(0.98); }

    .shift-title { font-size: 17px; font-weight: 700; color: var(--slate-dark); margin: 0 0 8px; }
    .shift-details { font-size: 13px; color: var(--slate-muted); margin-bottom: 16px; line-height: 1.5; }

    .cap-container { height: 6px; background: #E5E8E8; border-radius: 3px; margin-bottom: 6px; overflow: hidden; }
    .cap-bar { height: 100%; background: linear-gradient(90deg, #7F8C8D, var(--slate-dark)); transition: width 0.5s ease; }
    .cap-label { font-size: 11px; color: #7F8C8D; font-weight: 600; display: block; margin-bottom: 16px; }

    .btn-book {
      width: 100%; height: 50px; background-color: var(--slate-dark); color: #fff;
      border: none; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .btn-book:disabled { background-color: #BDC3C7; cursor: not-allowed; }

    /* Loading Spinner */
    .loader {
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px;
    }
    .spinner {
      width: 28px; height: 28px; border: 3px solid rgba(0,0,0,0.1);
      border-top-color: var(--slate-dark); border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="shell">
  <div class="header-area">
    <a href="dashboard.html" class="back-link">← Dashboard</a>
    <h1 class="page-title">Shift Bookings</h1>
    <p class="page-desc">Select an available event shift. Please note the strict one-shift-per-day policy.</p>
  </div>

  <div id="bookingContainer">
    <div class="loader">
      <div class="spinner"></div>
      <p style="font-size: 13px; color: var(--slate-muted); margin-top: 15px;">Updating Schedule...</p>
    </div>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyq0EucoCN7Y1O1k2mik8Ne7bZbPDfPonyJ9ac73UkzpBMCxsBBhVJ__0ZAC-Fr6OT5/exec";

  async function loadShifts() {
    const container = document.getElementById("bookingContainer");
    try {
      const res = await fetch(`${WEB_APP_URL}?action=get_available_shifts`);
      const data = await res.json();

      if (data.ok && data.shifts.length > 0) {
        container.innerHTML = "";
        data.shifts.forEach(shift => {
          const isFull = shift.current >= shift.max;
          const btnLabel = isFull ? "Join Waiting List" : "Book This Shift";
          
          container.innerHTML += `
            <div class="platinum-card">
              <h3 class="shift-title">${shift.title}</h3>
              <div class="shift-details">
                📅 <b>Date:</b> ${shift.date}<br>
                🆔 <b>ID:</b> ${shift.id}
              </div>
              <div class="cap-container">
                <div class="cap-bar" style="width: ${shift.percent}%"></div>
              </div>
              <span class="cap-label">${shift.current} / ${shift.max} Slots Filled</span>
              <button class="btn-book" onclick="processBooking('${shift.id}', '${shift.date}')">${btnLabel}</button>
            </div>
          `;
        });
      } else {
        container.innerHTML = "<p style='text-align:center; color:#7F8C8D;'>No shifts currently available.</p>";
      }
    } catch (e) {
      container.innerHTML = "<p style='text-align:center; color:red;'>Connection Error.</p>";
    }
  }

  async function processBooking(id, date) {
    const btn = event.target;
    btn.disabled = true;
    btn.innerHTML = "Syncing...";

    const worker = JSON.parse(localStorage.getItem("mitecWorkerRecord") || "{}");
    const docNo = worker.mykad_passport_no || localStorage.getItem("mcl_doc_no");

    const payload = {
      action: "book_shift",
      mykad_passport_no: docNo,
      shift_id: id,
      shift_date: date
    };

    try {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      alert(result.message);
      loadShifts(); // Refresh list
    } catch (e) {
      alert("Booking failed. Check connection.");
      btn.disabled = false;
      btn.innerHTML = "Retry";
    }
  }

  window.onload = loadShifts;
</script>

</body>
</html>
