<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MITEC — Casual Labour Portal</title>
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --mitec-blue: #092253;
      --mitec-blue-dark: #07223f;
      --mitec-accent: #0f4a82;
      --bg-base: #f4f5f8;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-muted: #86868b;
      --error: #ff3b30;
      --success: #34c759;
      --radius: 28px;
      --shadow-vip: 0 20px 40px rgba(7, 34, 63, 0.1);
      --marble-url: url('dark-blue-marble-plain-photo-wallpapers (1).jpg');
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      margin: 0; padding: 0;
      min-height: 100vh;
      background-color: var(--bg-base);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-main);
    }

    .shell { width: 100%; max-width: 420px; padding: 24px; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 48px 32px;
      text-align: center;
      box-shadow: var(--shadow-vip);
      border: 1px solid rgba(0,0,0,0.02);
    }

    .brand { margin-bottom: 32px; }
    .brand img { width: 130px; height: auto; object-fit: contain; }

    .title { 
      font-size: 24px; font-weight: 800; margin: 0 0 8px; 
      letter-spacing: -0.03em; color: var(--mitec-blue); 
    }
    .sub { font-size: 15px; color: var(--text-muted); margin: 0 0 36px; font-weight: 500; }

    /* Elegant Input Wrapper */
    .input-group { position: relative; margin-bottom: 24px; text-align: left; }
    
    .input-icon {
      position: absolute; left: 16px; top: 18px;
      font-size: 20px; color: var(--mitec-blue); z-index: 2;
    }

    .input-control {
      width: 100%; height: 58px; padding: 0 16px 0 48px;
      font-size: 16px; font-weight: 600;
      color: var(--text-main);
      border: 1.5px solid #e5e7eb;
      border-radius: 16px;
      background: #f9fafb;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-control:focus {
      border-color: var(--mitec-accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(15, 74, 130, 0.08);
    }

    .input-label {
      position: absolute; left: 48px; top: 18px;
      color: var(--text-muted);
      font-size: 16px; font-weight: 500;
      transition: 0.2s ease all;
      pointer-events: none;
    }

    .input-control:focus ~ .input-label,
    .input-control:not(:placeholder-shown) ~ .input-label {
      top: -10px; left: 12px; font-size: 12px;
      color: var(--mitec-accent);
      background: #fff; padding: 0 6px;
      font-weight: 800;
    }

    /* Marble Action Button */
    .btn-primary {
      width: 100%; height: 56px; border: none; border-radius: 18px;
      background: var(--marble-url) center/cover no-repeat;
      background-color: var(--mitec-blue);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: all 0.2s; margin-top: 8px;
      position: relative; overflow: hidden;
      box-shadow: 0 10px 20px rgba(9, 34, 83, 0.15);
    }
    
    .btn-primary::before {
      content: ''; position: absolute; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.2); transition: opacity 0.2s;
    }

    .btn-primary:hover::before { background: rgba(0,0,0,0.3); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary span { position: relative; z-index: 1; }

    .btn-link {
      display: inline-block; margin-top: 32px;
      font-size: 13px; font-weight: 700;
      color: var(--mitec-accent); text-decoration: none;
      padding: 12px 20px; border-radius: 14px;
      transition: background 0.2s;
      line-height: 1.4;
    }
    .btn-link:hover { background: rgba(15, 74, 130, 0.05); }

    .msg {
      margin-top: 24px; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 24px; line-height: 1.4;
    }
    .msg.error { color: var(--error); }
    .msg.success { color: var(--success); }

    .footer {
  width: 100%;
  ma.footer {
  text-align: center;
  margin-top: 48px;
  padding-bottom: 24px;
  line-height: 1.6;
}

.footer-main {
  font-size: 13px;
  font-weight: 700;
  color: var(--mitec-blue);
  letter-spacing: -0.01em;
}

.footer-sub {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: 4px;
}


  </style>
</head>
<body>

  <div class="shell">
    <div class="card">
      <div class="brand">
        <img src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC Logo">
      </div>

      <h1 class="title">Casual Labour Portal</h1>
      <p class="sub">Authorized Personnel Only</p>

      <div class="input-group">
        <i class="ph-fill ph-identification-card input-icon"></i>
        <input id="docInput" class="input-control" type="text" placeholder=" " autocomplete="off">
        <label class="input-label">IC / Passport Number</label>
      </div>

      <button id="loginBtn" class="btn-primary" onclick="handleLogin()">
        <span>Login</span>
      </button>

      <a href="129c.html" class="btn-link">First Time User?<br>Register / Update Account</a>

      <div id="loginMessage" class="msg"></div>
    </div>

    <div class="footer">
      Malaysia International Trade & Exhibition Centre<br>
      Casual Labour Management & Coordination System
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyq0EucoCN7Y1O1k2mik8Ne7bZbPDfPonyJ9ac73UkzpBMCxsBBhVJ__0ZAC-Fr6OT5/exec";

    const docInput = document.getElementById("docInput");
    const loginBtn = document.getElementById("loginBtn");
    const msg = document.getElementById("loginMessage");

    // --- POWER FEATURE: Fast-Pass Redirect ---
    window.addEventListener("DOMContentLoaded", () => {
      const savedDoc = localStorage.getItem("mcl_doc_no");
      const savedRecord = localStorage.getItem("mitecWorkerRecord");
      
      if (savedDoc && savedRecord) {
        window.location.href = "dashboard.html";
      } else {
        docInput.focus();
      }
    });

    function showStatus(text, isError = true) {
      msg.textContent = text;
      msg.className = isError ? "msg error" : "msg success";
      if (isError && text) {
        msg.innerHTML = `<i class="ph-bold ph-warning-circle"></i> ${text}`;
      } else if (text) {
        msg.innerHTML = `<i class="ph-bold ph-check-circle"></i> ${text}`;
      }
    }

    async function handleLogin() {
      const docNo = docInput.value.trim();
      if (!docNo) {
        showStatus("Identification Number is required.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.querySelector('span').textContent = "Verifying Identity...";
      showStatus("");

      try {
        const url = `${WEB_APP_URL}?action=check_existing&doc_no=${encodeURIComponent(docNo)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.ok && data.exists) {
          showStatus("Authorization Confirmed. Welcome.", false);

          localStorage.setItem("mitecWorkerRecord", JSON.stringify(data.record));
          localStorage.setItem("mcl_doc_no", docNo);
          
          if (data.summary) {
            localStorage.setItem("mitecLastSummary", JSON.stringify(data.summary));
          }

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 800);
        } else {
          showStatus(data.message || "Credential not recognized. Please register.");
          loginBtn.disabled = false;
          loginBtn.querySelector('span').textContent = "Authorize & Enter";
        }
      } catch (err) {
        console.error(err);
        showStatus("Registry connection error. Please retry.");
        loginBtn.disabled = false;
        loginBtn.querySelector('span').textContent = "Authorize & Enter";
      }
    }

    docInput.addEventListener("keypress", (e) => { if(e.key === "Enter") handleLogin(); });
  </script>

</body>
</html>
