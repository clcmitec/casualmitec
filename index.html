<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MITEC — Casual Labour Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <style>
    :root {
      --mitec-blue: #092253;
      --mitec-blue-hover: #07223f;
      --mitec-accent: #0f4a82;
      --bg-base: #f4f5f8;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-muted: #86868b;
      --error: #ff3b30;
      --success: #34c759;
      --radius: 24px;
      --shadow: 0 20px 40px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      margin: 0; padding: 0;
      min-height: 100vh;
      background-color: var(--bg-base);
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-main);
    }

    .shell { width: 100%; max-width: 420px; padding: 20px; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 48px 32px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.02);
    }

    .brand { margin-bottom: 32px; }
    .brand img { width: 130px; height: auto; object-fit: contain; }

    .title { font-size: 24px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.02em; }
    .sub { font-size: 15px; color: var(--text-muted); margin: 0 0 40px; }

    /* Premium Floating Input */
    .input-group { position: relative; margin-bottom: 24px; text-align: left; }

    .input-control {
      width: 100%; height: 58px; padding: 18px 16px;
      font-size: 16px; font-weight: 500;
      color: var(--text-main);
      border: 1.5px solid #e5e7eb;
      border-radius: 14px;
      background: #f9fafb;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-control:focus {
      border-color: var(--mitec-accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(15, 74, 130, 0.1);
    }

    .input-label {
      position: absolute; left: 16px; top: 18px;
      color: var(--text-muted);
      font-size: 16px; font-weight: 500;
      transition: 0.2s ease all;
      pointer-events: none;
    }

    .input-control:focus ~ .input-label,
    .input-control:not(:placeholder-shown) ~ .input-label {
      top: -10px; left: 12px; font-size: 12px;
      color: var(--mitec-accent);
      background: #fff; padding: 0 6px;
      font-weight: 700;
    }

    /* Buttons */
    .btn-primary {
      width: 100%; height: 54px; border: none; border-radius: 16px;
      background: var(--mitec-blue); color: #fff;
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; margin-top: 8px;
    }
    .btn-primary:hover { background: var(--mitec-blue-hover); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { background: #d1d5db; cursor: not-allowed; }

    .btn-link {
      display: inline-block; margin-top: 24px;
      font-size: 14px; font-weight: 600;
      color: var(--mitec-accent); text-decoration: none;
      padding: 10px 20px; border-radius: 12px;
      transition: background 0.2s;
    }
    .btn-link:hover { background: rgba(15, 74, 130, 0.05); }

    .msg {
      margin-top: 20px; font-size: 14px; font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 24px;
    }
    .msg.error { color: var(--error); }
    .msg.success { color: var(--success); }

    .footer {
      position: absolute; bottom: 24px;
      font-size: 12px; color: var(--text-muted);
      font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="shell">
    <div class="card">
      <div class="brand">
        <img src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" alt="MITEC Logo">
      </div>

      <h1 class="title">Casual Labour Access</h1>
      

      <div class="input-group">
        <input id="docInput" class="input-control" type="text" placeholder=" " autocomplete="off">
        <label class="input-label">IC / Passport Number</label>
      </div>

      <button id="loginBtn" class="btn-primary" onclick="handleLogin()">Login</button>

      <a href="129c.html" class="btn-link">First Time user? Register / Update Your Account Here</a>

      <div id="loginMessage" class="msg"></div>
    </div>
  </div>

  <div class="footer">Malaysia International Trade & Exhibition Centre <br> Casual Labour Portal</div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyq0EucoCN7Y1O1k2mik8Ne7bZbPDfPonyJ9ac73UkzpBMCxsBBhVJ__0ZAC-Fr6OT5/exec";

    const docInput = document.getElementById("docInput");
    const loginBtn = document.getElementById("loginBtn");
    const msg = document.getElementById("loginMessage");

    // --- POWER FEATURE: Fast-Pass Redirect ---
    // If user is already logged in, skip this page entirely.
    window.addEventListener("DOMContentLoaded", () => {
      const savedDoc = localStorage.getItem("mcl_doc_no");
      const savedRecord = localStorage.getItem("mitecWorkerRecord");
      
      if (savedDoc && savedRecord) {
        // User exists locally, go straight to the exclusive dashboard
        window.location.href = "dashboard.html";
      } else {
        docInput.focus();
      }
    });

    function showStatus(text, isError = true) {
      msg.textContent = text;
      msg.className = isError ? "msg error" : "msg success";
      if (isError && text) {
        msg.innerHTML = `<span class="material-symbols-outlined" style="font-size:18px;">warning</span> ${text}`;
      }
    }

    async function handleLogin() {
      const docNo = docInput.value.trim();
      if (!docNo) {
        showStatus("Please enter your Personal Identification Number (Mykad/Passport).");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Verifying...";
      showStatus("");

      try {
        // One-Shot Login: Gets Profile + Summary in one trip
        const url = `${WEB_APP_URL}?action=check_existing&doc_no=${encodeURIComponent(docNo)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.ok && data.exists) {
          showStatus("Authorized. Entering...", false);

          // Store for Dashboard & Profile use
          localStorage.setItem("mitecWorkerRecord", JSON.stringify(data.record));
          localStorage.setItem("mcl_doc_no", docNo);
          
          // If the server sent a summary, store it to make dashboard load instant
          if (data.summary) {
            localStorage.setItem("mitecLastSummary", JSON.stringify(data.summary));
          }

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 800);
        } else {
          showStatus(data.message || "Access denied. ID not recognized.");
          loginBtn.disabled = false;
          loginBtn.textContent = "Authorize Access";
        }
      } catch (err) {
        console.error(err);
        showStatus("System connection timeout. Try again.");
        loginBtn.disabled = false;
        loginBtn.textContent = "Authorize Access";
      }
    }

    docInput.addEventListener("keypress", (e) => { if(e.key === "Enter") handleLogin(); });
  </script>

</body>
</html>
