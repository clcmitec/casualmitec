<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MITEC HUB</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #f4f5f8; 
      --card-bg: #ffffff;
      --text-main: #102544;
      --text-muted: #6B7C93;
      --border: #DCE6F2;
      --shadow-soft: 0 8px 24px rgba(35,74,155,.06);
      
      --sapphire: #082567;
      --primary: #234A9B;
      --primary-2: #315FB3;
      --radius: 20px;

      --marble-texture: url('dark-blue-marble-plain-photo-wallpapers%20(1).jpg');
      
      --chrome-border: linear-gradient(145deg, #ffffff 0%, #cbd5e1 25%, #64748b 50%, #e2e8f0 75%, #ffffff 100%);
      --chrome-glow: 0 16px 32px rgba(148, 163, 184, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.9) inset;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      margin: 0; 
      padding: 12px 12px 100px; 
      background-color: var(--bg-base);
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
    }

    .shell { width: 100%; max-width: 430px; margin: auto; }

    .hero {
      background: linear-gradient(rgba(4, 17, 48, 0.25), rgba(4, 17, 48, 0.25)), var(--marble-texture);
      background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,.25);
      border-radius: 22px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; margin-top: 4px; margin-bottom: 20px; box-shadow: var(--shadow-soft);
    }

    .hero-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .hero-logo { height: 28px; width: auto; object-fit: contain; filter: brightness(0) invert(1); }

    .date-pill {
      display: flex; align-items: center; background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 999px;
      padding: 5px 12px; font-size: 10px; font-weight: 800; color: #FFFFFF;
      letter-spacing: 0.04em; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }

    .announcement-wrapper {
      overflow: hidden; border-radius: 28px; position: relative;
      background: var(--chrome-border); padding: 3.5px; box-shadow: var(--chrome-glow); margin-top: 14px; 
    }

    .announcement-track { display: flex; gap: 14px; }
    .announcement-card { min-width: 100%; background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%); border-radius: 25px; padding: 24px 20px; position: relative; overflow: hidden; }
    .announcement-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #FFFFFF, #E2E8F0, #FFFFFF); }
    .announcement-tag { display: inline-flex; background: #F1F5F9; color: #475569; padding: 4px 12px; border: 1px solid #E2E8F0; border-radius: 999px; font-size: 10px; font-weight: 900; letter-spacing: .08em; margin-bottom: 14px; }
    .announcement-body { font-size: 14px; color: var(--text-main); line-height: 1.6; font-weight: 600; }

    .animate-track { animation: autoSlide 15s infinite; }
    @keyframes autoSlide {
      0%, 28% { transform: translateX(0%); }
      33%, 61% { transform: translateX(calc(-100% - 14px)); }
      66%, 100% { transform: translateX(calc(-200% - 28px)); }
    }

    .carousel-dots { display: flex; justify-content: center; align-items: center; gap: 5px; margin-top: 10px; min-height: 5px; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); transition: all 0.3s ease; }
    .dot.active { background: #64748B; transform: scale(1.2); }

    .section { margin-top: 20px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .section-title { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
    .section-mini { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .metric { background: #FFFFFF; border: 1px solid var(--border); border-radius: 14px; padding: 10px; box-shadow: 0 3px 12px rgba(15,23,42,.03); display: flex; flex-direction: column; justify-content: center; min-height: 58px; }
    .metric-value { font-size: 15px; font-weight: 900; letter-spacing: -0.02em; color: var(--primary); }
    .metric-label { font-size: 9px; color: var(--text-muted); margin-top: 2px; }

    .birthday-card {
      background: linear-gradient(rgba(4, 17, 48, 0.4), rgba(4, 17, 48, 0.4)), var(--marble-texture);
      background-size: cover; background-position: center; border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px; padding: 14px; overflow: hidden; box-shadow: 0 12px 28px rgba(5, 20, 56, 0.18);
    }
    .spin-window { height: 140px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
    .spin-list { display: flex; flex-direction: column; gap: 8px; width: 100%; position: absolute; top: 0; }
    .animate-spin { animation: spinVertical 14s linear infinite; }
    @keyframes spinVertical { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

    .person {
      display: flex; align-items: center; background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px;
      padding: 10px 14px; min-height: 40px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .person-name { font-size: 12px; font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }

    .birthday-blessing-footer {
      text-align: center; font-family: 'Caveat', cursive; font-size: 18px; font-weight: 700; color: #ffffff;
      padding-top: 10px; margin-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.2);
      letter-spacing: 0.03em; text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    .system-nav {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 430px; height: 64px;
      background: linear-gradient(rgba(4, 17, 48, 0.4), rgba(4, 17, 48, 0.4)), var(--marble-texture);
      background-size: cover; background-position: center; border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px; display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 0; box-shadow: 0 12px 28px rgba(8, 34, 92, 0.4); z-index: 999; overflow: hidden;
    }
    .nav-item { display: flex; align-items: center; justify-content: center; position: relative; color: rgba(255, 255, 255, 0.45); text-decoration: none; z-index: 1; }
    .nav-item svg { width: 22px; height: 22px; stroke-width: 2; }
    .nav-item.active { color: #FFFFFF; filter: drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
    .nav-item.active::before { content: ''; position: absolute; width: 42px; height: 42px; border-radius: 14px; background: rgba(255, 255, 255, 0.12); z-index: 0; }
    
    .hub-spinner { width: 20px; height: 20px; border: 2px solid rgba(35,74,155,0.1); border-top-color: var(--primary); border-radius: 50%; animation: hubSpin 0.8s linear infinite; }
    .light-spinner { border-color: rgba(255,255,255,0.2); border-top-color: #fff; }
    @keyframes hubSpin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="shell">

  <section class="hero">
    <div class="hero-top">
      <div class="hero-left">
        <img src="https://mitec.com.my/static/img/logos/mitec-new-logo.png" class="hero-logo" alt="MITEC">
      </div>
      <div class="date-pill" id="currentTopDate">-- --- ----</div>
    </div>
  </section>

  <div class="announcement-wrapper">
    <div class="announcement-track" id="announcementTrack">
      <div class="announcement-card">
        <div style="display:flex; justify-content:center; padding:10px 0;">
          <div class="hub-spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="carousel-dots" id="carouselDots"></div>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">Network Analytics</h3>
      <span class="section-mini">Real-Time</span>
    </div>

    <div class="stats-grid">
      <div class="metric">
        <div class="metric-value" id="statActive"><div style="display:flex;justify-content:center;"><div class="hub-spinner" style="width:14px;height:14px;"></div></div></div>
        <div class="metric-label" style="text-align:center;">Total Sign In Today</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="statPending"><div style="display:flex;justify-content:center;"><div class="hub-spinner" style="width:14px;height:14px;"></div></div></div>
        <div class="metric-label" style="text-align:center;">Total In House</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="statLive"><div style="display:flex;justify-content:center;"><div class="hub-spinner" style="width:14px;height:14px;"></div></div></div>
        <div class="metric-label" style="text-align:center;">Pending Payment</div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">Today's Celebrations</h3>
      <span class="section-mini">Auto Rotation</span>
    </div>

    <div class="birthday-card">
      <div class="spin-window" id="spinWindow">
        <div style="display:flex; justify-content:center; align-items:center;">
          <div class="hub-spinner light-spinner"></div>
        </div>
      </div>
      
      <div class="birthday-blessing-footer">
        MITEC wishes you a wonderful and happy birthday!
      </div>
    </div>
  </section>

</div>

<nav class="system-nav">
  <a href="dashboard.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
  </a>
  <a href="hub.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
  </a>
  <a href="booking.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
  </a>
  <a href="https://lookerstudio.google.com/reporting/9b8a64f0-2e03-430d-aa29-bdb31989a35e" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"/>
      <line x1="12" y1="20" x2="12" y2="4"/>
      <line x1="6" y1="20" x2="6" y2="14"/>
    </svg>
  </a>
  <a href="profile.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
  </a>
</nav>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyq0EucoCN7Y1O1k2mik8Ne7bZbPDfPonyJ9ac73UkzpBMCxsBBhVJ__0ZAC-Fr6OT5/exec";

  function toProperCase(str) {
    if (!str) return "";
    return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  }

  function formatSystemDate() {
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const now = new Date();
    document.getElementById("currentTopDate").textContent = `${String(now.getDate()).padStart(2, '0')} ${months[now.getMonth()]} ${now.getFullYear()}`;
  }

  function loadHubSpreadsheetData() {
    const script = document.createElement("script");
    script.src = `${WEB_APP_URL}?action=get_hub_data&prefix=processMasterHubPackage&_=${new Date().getTime()}`;
    script.onerror = function() {
      console.error("Network interface pipeline error.");
      showFallbackNotice();
    };
    document.head.appendChild(script);
  }

  // TARGETED CHANGE: Maps your new labels seamlessly to existing property keys parsed from the backend variables package
  window.processMasterHubPackage = function(data) {
    if (data && data.ok) {
      // Safely reads spreadsheet numerical values mapping total_signin, total_inhouse, and pending_payment rows
      document.getElementById("statActive").textContent = data.stats.active ? Number(data.stats.active).toLocaleString() : "0";
      document.getElementById("statPending").textContent = data.stats.pending ? Number(data.stats.pending).toLocaleString() : "0";
      document.getElementById("statLive").textContent = data.stats.live ? Number(data.stats.live).toLocaleString() : "0";

      // Populate Announcements Track Slider
      const track = document.getElementById("announcementTrack");
      const dotsContainer = document.getElementById("carouselDots");
      track.innerHTML = "";
      if(dotsContainer) dotsContainer.innerHTML = "";

      if (data.announcements && data.announcements.length > 0) {
        data.announcements.forEach((ann, index) => {
          track.innerHTML += `
            <div class="announcement-card">
              <div class="announcement-tag">${ann.tag}</div>
              <p class="announcement-body">${ann.body}</p>
            </div>`;
          if(dotsContainer) {
            dotsContainer.innerHTML += `<div class="dot ${index === 0 ? 'active' : ''}"></div>`;
          }
        });

        if (data.announcements.length > 1) {
          track.classList.add("animate-track");
          setupCarouselDotTriggers(data.announcements.length);
        }
      } else {
        showFallbackNotice();
      }

      // Populate Birthday Scroller Matrix
      const spinWindow = document.getElementById("spinWindow");
      if (data.birthdays && data.birthdays.length > 0) {
        let bdayListHtml = "";
        data.birthdays.forEach(name => {
          bdayListHtml += `
            <div class="person">
              <span class="person-name">${toProperCase(name)}</span>
            </div>`;
        });
        spinWindow.innerHTML = `<div class="spin-list animate-spin">${bdayListHtml}${bdayListHtml}</div>`;
      } else {
        spinWindow.innerHTML = `
          <div class="person" style="width:100%; justify-content:center;">
            <span class="person-name">No birthdays scheduled today 🎉</span>
          </div>`;
      }
    } else {
      showFallbackNotice();
    }
  };

  function showFallbackNotice() {
    document.getElementById("announcementTrack").innerHTML = `
      <div class="announcement-card">
        <div class="announcement-tag">NOTICE</div>
        <p class="announcement-body">No active updates or briefings listed for today.</p>
      </div>`;
    const dotsContainer = document.getElementById("carouselDots");
    if(dotsContainer) dotsContainer.innerHTML = "";
    
    document.getElementById("statActive").textContent = "--";
    document.getElementById("statPending").textContent = "--";
    document.getElementById("statLive").textContent = "--";
    document.getElementById("spinWindow").innerHTML = `
      <div class="person" style="width:100%; justify-content:center;">
        <span class="person-name">Records offline</span>
      </div>`;
  }

  function setupCarouselDotTriggers(totalCards) {
    const dots = document.querySelectorAll(".dot");
    let current = 0;
    setInterval(() => {
      if(dots[current]) dots[current].classList.remove("active");
      current = (current + 1) % totalCards;
      if(dots[current]) dots[current].classList.add("active");
    }, 5000); 
  }

  window.addEventListener("DOMContentLoaded", () => {
    formatSystemDate();
    loadHubSpreadsheetData();
  });
</script>

</body>
</html>
